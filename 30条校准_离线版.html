<script id="site-data" type="application/json">{"records":[{"record_id":"R-E4URRJVE","title":"Penile Anthropometry","abstract":"Commonest complaint in the long-term follow-up of Hypospadiacs is the short penis, and all pediatricians and clinicians frequently encounter the questions by parents regarding the standard size of their child’s penis. Much less than required attention is paid to the size of the penis in management of hypospadias repair. Size of the penis and glans is a vital variable in defining the outcome of hypospadias surgery. The abnormalities of penile morphology are likely to affect interpersonal relations. It may also lead to emotional disturbances with the growth of a child to adulthood. Child’s parents/patients may have a misconception of the size of the penis, even in the cases of normal variations. On the other hand, the micropenis must be ruled out. The penis otherwise is normal in terms of shape and function, but is smaller by >2.5 SD than the mean size in terms of length for age of the child is termed as micropenis. With a defined penile nomogram, the patients and parents can be counseled regarding the penile size. However, as the physical stature differs across racial and ethnical spectrums, it stands to reason that penile size may vary too. A separate penile dimensions chart may be necessary to define the standard penile dimensions among various population groups. The chapter will provide denominator about the size of the penis and its relation with age and BMR, which will help in the timely clinician treatment. © The Editor(s) (if applicable) and The Author(s), under exclusive license to Springer Nature Singapore Pte Ltd. 2022.","doi":"10.1007/978-981-16-8395-4_4","pmid":"","date":"2022","journal":"","authors":"Bhat M.; Bhat A."},{"record_id":"R-RE3SG893","title":"Occupational exposure to endocrine-disrupting chemicals and other parental risk factors in hypospadias and cryptorchidism development: a case-control study","abstract":"Aim of the study\n   Endocrine-disrupting chemicals (EDCs) are exogenous agents that are capable of altering the endocrine system functions, including the regulation of developmental processes. The aim of this study was to investigate the association between EDC exposure and other parental factors in the etiology of hypospadias and cryptorchidism.\n   Methods\n   A case-control study was conducted. Cases (n = 210) were infants aged between 6 months and 14 years diagnosed with hypospadias or cryptorchidism who attended the authors' hospital over a period of 18 months, and controls (n = 210) were infants within the same range of age and without any urological disorders who attended the outpatient clinic of the same hospital during the same time period. Their selection was independent of exposures. Data on parental occupational exposure to EDCs and other sociodemographic variables were collected through face-to-face interviews and systematically for both cases and controls. Crude and adjusted odds ratios (ORs) were estimated to control for confounding with their 95% confidence interval (CI) by means of logistic regressions. Specifically, three final models of a dichotomous outcome were constructed: one for cryptorchidism, one for hypospadias, and the third considering both malformations together. The Hosmer-Lemeshow test was used to assess the goodness of fit of the models. Their discriminatory accuracy (DA) was ascertained by estimating their areas under the receiver operating characteristic curves area under the curve (AUC) along with their 95% CI.\n   Results\n   Associations were found between advanced maternal age (OR adjusted = 1.82; 95% CI: 1.14-2.92), mother's consumption of anti-abortives (OR = 5.40; 95% CI: 1.40-38.5) and other drugs (OR = 2.02; 95% CI: 1.31-3.16) during pregnancy, maternal and paternal occupational exposure to EDCs (OR = 4.08; 95% CI: 2.03-8.96 and OR = 3.90; 95% CI: 2.41-6.48, respectively), fathers smoking (OR = 2.0; 95% CI: 1.33-2.99), and fathers with urological disorders (OR = 2.31; 95% CI: 1.15-4.90). Maternal and paternal high educational level could be protective of cryptorchidism (OR = 0.47; 95% CI: 0.28-0.76 and OR = 0.63; 95% CI: 0.42-0.93, respectively). The DA of the models for the whole sample (AUC = 0.75; 95% CI: 0.70-0.79) for cryptorchidism (AUC = 0.76; 95% CI: 0.71-0.82) and for hypospadias (AUC = 0.75; 95% CI: 0.69-0.81) was moderately high.\n   Conclusions\n   Advanced age, some parental occupational exposure to EDCs, some drug consumption, smoking, and the father's history of urological disorders may increase risk and predict the developments of these malformations. Studies with higher samples sizes are needed to assess associations between individual EDC occupational exposures and drugs and these malformations.","doi":"10.1016/j.jpurol.2019.07.001","pmid":"","date":"2019 OCT","journal":"JOURNAL OF PEDIATRIC UROLOGY","authors":"Sastre BE; Artero CC; Ruiz YG; Atuan RLF; Rodríguez PB; Juan GF; Romero JG"},{"record_id":"R-CVIUDER6","title":"Animal Toxicology Studies on the Male Reproductive Effects of 2,3,7,8-Tetrachlorodibenzo-p-Dioxin: Data Analysis and Health Effects Evaluation","abstract":"2,3,7,8-Tetrachlorodibenzo-p-dioxin (TCDD) is a well-known environmental poison that exist in the environment for many years. However, its effect on the male reproductive system has not been clearly stated. We conducted a meta-analysis of the effect of TCDD on the male reproductive system of rodents about TCDD. Results showed that that TCDD exposure reduced the testis weight (weighted mean difference [WMD]: −0.035, 95% confidence interval [CI]: −0.046 to −0.025), sperm count (WMD: −35, 95% CI: −42.980 to −27.019), and blood testosterone concentration (WMD: −0.171, 95% CI: −0.269 to −0.073). According to our research results, TCDD can cause damage to the male reproductive system of rodents through direct or indirect exposure. In order to further explore the potential hazards of TCDD to humans, more human-related research needs to be carried out. Copyright © 2021 Zhang, Zhou, Ren, Zhang, Wu, Wang and Wang.","doi":"10.3389/fendo.2021.696106","pmid":"","date":"2021","journal":"Frontiers in Endocrinology","authors":"Zhang T.; Zhou X.; Ren X.; Zhang X.; Wu J.; Wang S.; Wang Z."},{"record_id":"R-ADEIKXTK","title":"Penile anthropometry of healthy boys in Qatar.","abstract":"Background Penile anthropometry is essential for diagnosing genital anomalies. However, as these biometric values vary ethnically, population-specific standards are necessary. Aim To establish the first penile anthropometric nomograms for boys in Qatar. Study design This prospective cross-sectional study included 210 healthy boys in Qatar (aged 6 months to 12 years) undergoing elective circumcision at Hamad Medical Corporation (October 2023–October 2024). We recorded demographic data and measured stretched penile length (SPL), glans diameter at the coronal sulcus (GDCL), and mid-penile diameter (MPD). Age-specific nomograms were generated, and associations between SPL, age, and BMI were analyzed using SPSS v27. Results Mean SPL, GDCL, and MPD for infants (6–12 months) were 3.75 ± 0.4 cm, 1.36 ± 0.1 cm, and 1.28 ± 0.1 cm, respectively. For boys (1–12 years), values were 5.53 ± 0.9 cm, 1.71 ± 0.2 cm, and 1.61 ± 0.21 cm. SPL showed a biphasic growth pattern: a gradual increase from 3.75 ± 0.4 cm (6 months–5 years) to 4.90 ± 0.9 cm (6–10 years), followed by rapid growth to 7.72 ± 1.3 cm at 11–12 years. SPL correlated with height age but not with body mass index. Discussion This study provides the first population-specific nomograms for penile anthropometry of healthy boys in Qatar. The observed biphasic growth pattern is consistent with global trends but shows distinct ethnic variations. Limitations include the lack of data for infants under six months. Compared internationally, our results align with Middle Eastern cohorts but differ from Asian and South American populations, underscoring the need for local reference standards. These findings have direct clinical applicability, providing essential reference data to prevent misdiagnosis of conditions like micropenis. Conclusions We successfully established an age-specific nomogram for penile biometrics of boys in Qatar. These normative data provide region-specific reference values to support the clinical assessment of disorders of sexual development and to optimize surgical decision-making in hypospadias repair. © 2026 Journal of Pediatric Urology Company.","doi":"10.1016/j.jpurol.2026.106050","pmid":"","date":"2026","journal":"Journal of Pediatric Urology","authors":"Joya Habib Ullah; Alansari Amani N.; Rosales Carlos Hernandez; Ahmed G Al-Romaihi Sheyma"},{"record_id":"R-W65Z6DUJ","title":"A multi-center study on the development of clinical prediction model for complications after transverse preputial island flap urethroplasty","abstract":"Objective To explore the risk factors for postoperative complications in children with hypospadias undergoing transverse preputial island flap（TPIF）urethroplasty and to construct a clinical prediction model for postoperative complications. Methods A retrospective analysis was conducted on the clinical data of 543 children with hypospadias treated with the TPIF procedure at 17 hospitals，including Beijing Children’s Hospital Affiliated to Capital Medical University，Sichuan Provincial People’s Hospital，and 15 other hospitals，from December 2018 to September 2021. The patients’ age at surgery was 26（19，36）months，with penile length of 3.5（3.0，4.0）cm，glans length of 10.0（9.0，12.5）mm，glans width of 13.5（12.5，14.0）mm，urethral plate width of 4（3，5）mm，urethral defect length of 3.5（3，3.8）cm，and penile curvature degree of 60（50，80）°. Follow-up was conducted to identify postoperative complications such as urethral fistula，urethral stricture，and urethral diverticulum. Patients were divided into groups based on the presence or absence of complications after TPIF，and differences in clinical characteristics between the two groups were compared. Univariate and multivariate logistic regression analyses were used to identify risk factors for postoperative complications after the TPIF procedure，and a nomogram model was developed to predict postoperative complications. Internal validation was performed using 1 000 Bootstrap resampling，calibration curves were plotted，the area under the receiver operating characteristic（ROC）curve（AUC）was used to assess the discriminative ability of the model，and the Hosmer-Lemeshow goodness-of-fit test was used to evaluate the calibration of the prediction model. Results Among 543 patients with a postoperative follow-up time of 42（29，61）months，the overall complication rate was 42.9%（233/543），including urethral fistula in 155 cases（28.5%），urethral stricture in 88 cases（16.2%），urethral diverticulum-like dilation in 48 cases（8.8%），and residual/recurrent penile curvature in 1 case（1.4%）. The urethral defect length[3.5（3.0，4.0）cm vs. 3.2（3.0，3.5）cm]，urethral defect ratio（UDR）[1.00（0.82，1.17）vs. 0.91（0.75，1.09）]，and penile curvature degree[70（60，80）° vs. 60（40，70）°]in the complication group were significantly greater than those in the non-complication group（all P \u003c 0.001）. Univariate logistic regression analysis identified preoperative urethral meatus location before chordee correction，degree of penile curvature，UDR ratio，and urethral defect length as risk factors for postoperative complications of the TPIF procedure（P \u003c 0.05）. Multivariate logistic analysis showed that the degree of penile curvature（OR = 1.02，95%CI 1.01‒1.03）and urethral defect length（OR = 1.56，95%CI 1.08‒2.24）were independent risk factors for postoperative complications of the TPIF procedure. A nomogram model constructed based on these independent risk factors achieved an AUC of 0.672（95%CI 0.626‒0.717），and the Hosmer-Lemeshow goodness-of-fit test yielded a P value of 0.880，indicating good model fit. Conclusions This multi-center study on hypospadias showed that the degree of penile curvature and the length of urethral defect were independent risk factors for postoperative complications after TPIF surgery. The clinical prediction model for postoperative complications constructed based on the above indexes has a certain degree of differentiation and calibration，providing an evaluation basis for predicting the incidence of postoperative complications. 2026, Chinese Medical Association","doi":"10.3760/cma.j.cn112330-20250104-00009","pmid":"","date":"2026","journal":"Chinese Journal of Urology","authors":"Fang Y.; Song H.; Sun N.; Zhang W.; Tang Y.; Wang X.; Huang L.; Zeng L.; Yang Y.; Liu X.; Chao M.; Zhang Y.; Ma H.; Liu H.; Zhang J.; Kang L.; Zhang X.; Meng Q.; Li S.; Xie J.; Zhou X.; Li N.; Chen C.; Su C.; He D.; Liu X.; Wu W.; Tang J.; Xie H.; Wu M.; Guan Y.; Wang X.; Yang Y.; Zhang J."},{"record_id":"R-LGBNG7GU","title":"Disruption of FBN1 by an Alu element insertion: A novel genetic cause of Marfan syndrome","abstract":"Alu elements are retrotransposons with ubiquitous presence in the human genome that have contributed to human genomic diversity and health. These approximately 300-bp sequences can cause or mediate disease by disrupting coding/splicing regions in the germline, by insertional mutagenesis in somatic cells, and in promoting formation of copy-number variants. Alu elements may also disrupt epigenetic regulation by affecting non-coding regulatory regions. There are increasing reports of apparently sporadic and inherited genetic disorders caused by Alu-related gene disruption, but Marfan syndrome resulting from Alu element insertion has not been previously described. We report a family with classic features of Marfan syndrome whose previous FBN1 genetic testing was inconclusive. Using contemporary next-generation sequencing and bioinformatics analysis, a pathogenic/disruptive Alu insertion occurring in the coding region of the FBN1 gene was identified (c.6564_6565insAlu; p. Glu2189fs) and was confirmed and specified further with Sanger sequencing. This identified the molecular basis of disease in the family that was missed using previous genetic testing technologies and highlights a novel pathogenic mechanism for Marfan syndrome. This case adds to the growing literature of Mendelian diseases caused by Alu retrotransposition, and it also shows the growing capability of genomic technologies for detecting atypical mutation events. © 2023 Elsevier Masson SAS","doi":"10.1016/j.ejmg.2023.104775","pmid":"","date":"2023","journal":"European Journal of Medical Genetics","authors":"Helm B.M.; Smith A.M.; Schmit K.; Landis B.J.; Vatta M.; Ware S.M."},{"record_id":"R-7BJUMXJE","title":"Distribution of Pathogenic Bacteria of Postoperative Wound Infection and Early Prediction Value of Serum in Children with Hypospadias","abstract":"The objective of this study was to investigate the distribution of pathogens and the early predictive value of serum in children with hypospadias. The sample consisted children with hypospadias between January 2019 and December 2021 at the Second Affiliated Hospital. 136 children were treated with operation and one-stage urethral reconstruction and divided into infection group (n=18) and non-infection group (n=118). The multivariate logistic regression analysis showed that Snodgrass, penile downward curve, scrotal dysplasia, prolonged operation time, C-reactive protein (CRP), soluble myeloid triggered receptor 1 (sTREM-1), soluble intercellular adhesion molecule-1 (sICAM-1), white blood cell (WBC) and neutrophil / lymphocyte ratio (NLR) at 24 h after operation were the risk factors for postoperative wound infection in children with hypospadias (P\u003c0.05). ROC curve analysis showed that the ROC-AUC predicted by CRP, sTREM-1, sICAM-1, WBC and NLR at 24 h after operation were 0.729, 0.788, 0.821, 0.833, 0.765 and 0.802 respectively. The ROC-AUC of the combination of the above infection indexes was 0.904. The main wound infection after hypospadias is gram-negative bacteria infection. Snodgrass, penile curvature, scrotal dysplasia, prolonged operation time and more than 24 h after operation can increase the risk of wound infection in children with hypospadias. The combination of the above infection indexes has important value in predicting wound infection, and more attention should be paid to the children with the above risk factors in clinical nursing. Copyright 2024 by the authors.","doi":"10.17582/journal.pjz/20230602210624","pmid":"","date":"2024","journal":"Pakistan Journal of Zoology","authors":"Jin M.; Hu X.; Yu L.; Zheng S.; Huang H.; Chen F."},{"record_id":"R-3DG7UXMM","title":"Development and validation of a predictive nomogram for urethral plate transection in Chinese patients with hypospadias.","abstract":"Purpose: To develop and validate a predictive model for transecting urethral plate (UP) in Chinese patients with hypospadias surgery. Methods: A total of 860 children with primary hypospadias from Children’s Hospital of Fudan University from January 2019 to December 2022 and 368 children with primary hypospadias from Renji Hospital, School of Medicine, Shanghai Jiao Tong University from January 2021 to June 2023 were retrospectively analyzed and divided into a training set and a validation set. Multivariate logistic regression analysis was used to identify the predictors, and a nomogram model was constructed to predict the operation of UP transection in the training set. Use area under the curve(AUC), calibration curve(CC), decision curve analysis(DCA) and clinical impact curve(CIC) evaluated the predictive accuracy and clinical benefit of the nomogram model. Results: Multivariable logistic regression analysis showed that meatus position(MP), penile curvature(PC), penis diameter(PD) and urethral defect/stretched penile length(UDR) were independent predictors for UP transection in hypospadias surgery. The AUC of the nomogram in the training set and validation set were 0.810 and 0.791, respectively. The CC of the nomogram was close to the ideal diagonal line. Furthermore, the DCA and CIC demonstrated significantly better net benefit in the model. The internal and external validation groups proved the reliability of the predictive nomogram. Conclusions: This study demonstrated that MP, PC, PD and UDR were significant predictors of UP transection in Chinese patients with hypospadias surgery. This may guide surgical decision-making and treatment. © The Author(s) 2026.","doi":"10.1186/s12887-026-06518-x","pmid":"","date":"2026","journal":"BMC Pediatrics","authors":"Zhuang Likai; Pan Wenfeng; Wu Min; Li Zhanchi; Liu Yidong; Xu Hong"},{"record_id":"R-I8RS8FGD","title":"先天性尿道下裂患者的尿流率特点及其分析","abstract":"目的:研究先天性尿道下裂患者的尿流率特点。方法:笔者对22名2－6岁的先天性尿道下裂患者和22名同年龄组正常男性儿童进行尿流率测定,对比观察尿流率曲线的特点,并应用Toguri尿流率列线图对测定结果进行了分析。结果:与正常男性儿童的钟形尿流率曲线相比,尿道下裂患者的尿流率曲线呈平台形。22例尿道下裂患者中,1例(4.5%)患者的尿流率曲线与对照钟形曲线基本一致,18例(81.8%)患者的尿流率曲线呈平台形,3例(13.6%)患者尿流率曲线明显低平。在Toguri尿流率列线图上,尿道下裂患者最大尿流率坐标点位于正常人群第5百分位数曲线附近区域,明显低于正常水平。结论:先天性尿道下裂患者尿流率曲线多数呈平台形,最大尿流率明显低于正常水平。","doi":"10.3969/j.issn.1008-6455.2012.11.011","pmid":"","date":"2012","journal":"中国美容医学","authors":"王永前; 李森恺; 李养群; 李强; 刘立强; 徐家杰"},{"record_id":"R-FHSBSVUG","title":"[Mouth mucosa free-flap grafts in repeat operations of hypospadias].","abstract":"BACKGROUND AND AIMS: Buccal mucosal grafts are widely used in the treatment of primary hypospadias and urethral stenosis owing to their elasticity, optimal  attachment, possibility of generous harvesting and easy preparation. The aim of  this study was to check whether buccal mucosal flaps are also valuable in redo  surgery for hypospadias complicated by large breaks in the urethra and with  scarce residual genital tissue. METHODS: Fourteen patients aged between 3 and 11  years old (mean age 6.6) were selected and operated between December 1993 and  June 1999. The patients presented extensive fistulous tracts, roughly ellipsoidal  in shape and with a maximum diameter of between 7 and 42 mm (mean length 18 mm).  The original technique was: Duplay (7 patients); Onlay buccal graft (1 patient);  Snodgrass (1 patient); Tubulised preputial flap (2 patients); Onlay preputial  graft (2 patients); Tubulised vesical mucosal flap (1 patient). The mucosal flap,  taken from the lower lip, was used to cover the gap as an onlay patch and  recovered with residual genital skin with the interposition, where possible, of a  de-epithelised flap. RESULTS: An optimal cosmetic and functional result was  achieved in 10/14 cases with flowmetry > 25 percentile according to Toguri  nomograms. Three patients presented fistulas: one punctiform fistula resolved  spontaneously. The other two cases resolved after corrective surgery. One patient  showed meatal regression with slight stenosis that was resolved with MAGPI.  CONCLUSIONS: These results appear to be encouraging. Buccal mucosal graft may  represent a valid alternative also in the treatment of secondary hypospadia with  large breaks in the urethra. No complication was reported in the harvesting area,  even if this was carried out at a second stage in the labial area.","doi":"","pmid":"11268928","date":"2000 Dec","journal":"Minerva pediatrica","authors":"Marte A.; Cotrufo A. M.; Del Monaco C.; Di Iorio G.; De Pasquale M."},{"record_id":"R-UJICLQQH","title":"The buccal mucosa “Snodgraft” hypospadias repair: Our experience","abstract":"Introduction and Objective: The “Snodgraft” hypospadias repair represents a modification of the tubularized incised plate TIP repair popularized by Snodgrass in which the incision of the urethral plate is grafted instead of waiting for a spontaneously re-epithelisation. This technique is our first option for primary or reoperative hypospadias repair when the quality of the urethral plate allows a one stage repair. The objective is to assess the results of the “Snodgraft” technique in the primary or re-operative hypospadias repairs. Material and Methods: Between January 2003 and January 2010 we have performed 88 urethroplasties for primary hypospadias or hypospadias cripples. In 34 cases we performed a two-stage repair and in 54 cases a one-stage procedure: 28 Snodgraft repairs, 3 ventral flap repairs, 23 dorsal or ventral buccal mucosa graft (BMG) repairs for strictures and fistulas after multiple operations. From those 28 cases 15 were for primary hypospadias and 13 for failures repair (1-4 failed operations). The patient's age was between 3-34 years old. The surgical technique involved the dorsal incision of the urethral plate and of the glans which is quilted with a BMG. The urethral plate is dissected from lateral aspects, sutured ventrally and covered with dartos flaps. Results: We have registered glans dehiscence in 3 cases (10.7%), small urethral fistula in 6 cases (21.4%), and coronal skin necrosis in 10 cases (35.7%), all of these complications being resolved with secondary sutures 3-4 weeks after a suprapubic cystostomy insertion. Functional outcome was good in all cases, the patients voiding with 14-32 ml peak-flow without residual urine. The cosmetic outcome was good in 19 cases and satisfactory in 9 cases. Conclusions: By placing a buccal mucosa graft in the dorsal urethral plate incision instead of spontaneously re-epithelisation, the risk of urethral healing defect and consequently urethral strictures and fistula is diminished. “Snodgraft” is a safe one stage procedure, with predictable good functional and cosmetic results in primary or failed hypospadias repair.","doi":"10.1016/j.urology.2011.07.288","pmid":"","date":"2011","journal":"Urology","authors":"Patrascoiu S.; Gingu C.; Harza M.; Chibelean C.; Surcel C.; Zogas V.; Balsanu C.; Dick A.; Domnisor L.; Sinescu I."},{"record_id":"R-69VH3IXH","title":"A real-world pharmacovigilance study of modafinil events in the FDA Adverse Event Reporting System (FAERS)","abstract":"Objective This study aims to analyze adverse events (AEs) associated with modafinil based on the FAERS database to provide insights for its safety monitoring. Methods For quantifying signals of modafinil-related AEs, disproportionality analyses were employed, including the use of measures such as the Reporting Odds Ratio (ROR), Proportional Reporting Ratio (PRR), Multi-Item Gamma Poisson Shrinker (MGPS) and Bayesian Confidence Propagation Neural Network (BCPNN) algorithms. Results We extracted modafinil-related AE reports from the FAERS database spanning from the first quarter of 2004 to the first quarter of 2024 and conducted detailed data analysis. Out of a total of 21,035,995 case reports, 3070 were directly associated with modafinil. We identified 127 Preferred Terms (PTs) to describe these AEs, encompassing 27 organ systems. Specifically, several AEs such as stress cardiomyopathy, brain oedema, hypotonia, abortion spontaneous, premature labour, neonatal disorder, and eosinophilic myocarditis were not explicitly mentioned in the drug label, indicating potential new signals of adverse drug reactions (ADRs). The median onset time of modafinil-related AEs was 76.5 days (interquartile range [IQR] 14–392 days), with most AE cases occurring in the first month after initiation of modafinil. Conclusion Analysis of the FAERS database identified AEs associated with modafinil, particularly diseases related to pregnancy, puerperium and perinatal conditions, as well as congenital, familial and genetic disorders and cardiac disorders that were not previously documented in the drug's official labeling. These findings underscore the need for continuous post-market surveillance among healthcare professionals and heightened awareness of potential new ADR signals. © 2025 Elsevier B.V.","doi":"10.1016/j.jad.2025.121039","pmid":"","date":"2026","journal":"Journal of Affective Disorders","authors":"Zhang M.; Huang J.; Zheng X.; Zheng S.; Shi J.; Huang P.; Yang X."},{"record_id":"R-CVEYJTJP","title":"Urodynamic evaluation of hypospadias repair.","abstract":"PURPOSE: We performed a cross-sectional evaluation of voiding in a population undergoing hypospadias repair to determine whether patients had urinary  obstruction at various intervals of followup after the last operation. MATERIALS  AND METHODS: Of approximately 600 patients undergoing hypospadias repair at our  department during a 30-year interval 175, 40 months to 66 years old were  evaluated. Therefore, we created a cross-sectional study group for evaluation of  voiding function. All patients had undergone the final operation for hypospadias  at least 1 year previously and were toilet trained. Severity of the initial  hypospadias was scored together with the operative technique. Parameters  evaluated were medical history, physical examination and uroflowmetry using a  rotating disk. Uroflowmetry data (maximum flow rate and voided volume) were  plotted in age-related nomograms in 4 different age groups: less than 8 (28  patients), 9 to 14 (18), 15 to 21 (39) and more than 21 (91) years old. All flow  charts were evaluated by 2 of us (J. F. A. v. d. W. and E. B.). RESULTS: The  severity of initial disease was grade 1 in 30% of the patients, grade 2 in 57%,  grade 3 in 10%, grade 4 in 2% and unknown in 2%. The operative technique  performed was a van der Meulen repair in 113 patients (65%), a combined  Byars-Denis Browne repair in 56 (32%) and miscellaneous in 6 (3%). According to  the uroflowmetry nomograms there was a tendency for an increased number of  patients to have a normal maximum flow rate with increasing age. A total of 14  patients had a flow curve that suggested distal urethra obstruction and none was  symptomatic. There was no difference in uroflowmetry characteristics regarding  the operative technique. CONCLUSIONS: No difference in uroflowmetry could be  established among the operations. There seemed to be a tendency towards  improvement in uroflowmetry with increasing followup. There was no direct  relationship between low maximum flow rates and clinical apparent obstruction.","doi":"10.1097/00005392-199704000-00047","pmid":"9120936","date":"1997 Apr","journal":"The Journal of urology","authors":"van der Werff J. F.; Boeve E.; Brussé C. A.; van der Meulen J. C."},{"record_id":"R-6UR3EFAA","title":"AOP report: Adverse outcome pathway network for developmental androgen signaling inhibition leading to hypospadias.","abstract":"This report summarizes an adverse outcome pathway network (AOPN) describing how reduced androgen signaling during fetal life may lead to hypospadias in male offspring. Hypospadias is a penile malformation caused by disrupted masculinization of the genital tubercle. Under normal physiological conditions, androgen action promotes differentiation of the genital tubercle to a penis in male fetuses. Suboptimal androgen receptor signaling can impair genital tubercle development, causing hypospadias in humans and other mammals. In rodent toxicity studies, including test guideline studies from the Organisation for Economic Co-operation and Development for reproductive toxicity, hypospadias is assessed as an adverse outcome. This report presents three adverse outcome pathways (AOP-Wiki IDs 477, 570, 571), each with distinct upstream events representing antiandrogenic mechanisms. Downstream, the pathways converge at the nodal key event “decrease, androgen receptor activation” (1614) and share the adverse outcome “hypospadias” (2082). This report provides assessments of all three adverse outcome pathways (477, 570, 571), including one new key event (2082) and three new key event relationships (2828, 3350, 3488) not previously reported. The three key event relationships, connecting upstream events nonadjacently with the adverse outcome, were developed using a systematic weight-of-evidence approach. Overall, empirical evidence for the adverse outcome pathways is strong, with few exceptions or uncertainties. The AOPN is considered applicable to male mammals, but supporting data come primarily from rodent and human studies; hence, the applicability domain is currently restricted to these species. While quantitative understanding remains limited, the AOPN establishes robust mechanistic links between antiandrogenic activity and hypospadias, providing a foundation for future efforts to quantify key event relationships and develop predictive methods based on upstream events, often measured in vitro. © The Author(s) 2026. Published by Oxford University Press on behalf of the Society of Environmental Toxicology and Chemistry. This is an Open Access article distributed under the terms of the Creative Commons Attribution License (https://creativecommons.org/licenses/by/4.0/), which permits unrestricted reuse, distribution, and reproduction in any medium, provided the original work is properly cited.","doi":"10.1093/etojnl/vgag120","pmid":"","date":"2026","journal":"Environmental Toxicology and Chemistry","authors":"Elmelund Emilie; Draskau Monica K.; Holbech Henrik; Svingen Terje"},{"record_id":"R-P976VP3B","title":"尿道下裂发生的危险因素研究","abstract":"目的:研究尿道下裂发生的危险因素。方法:按统一的调查方法对90例江西籍尿道下裂患者母亲和180例正常儿童的江西籍母亲进行面对面问卷调查,应用软件对所有调查因素进行多因素Logistic回归分析。结果:尿道下裂发生与妊娠早期母体吸烟(X2)、接触农药(X5)、接触杀虫剂(X6)及胎儿低出生体质量(X12)呈正相关(均P\u003c0.05)。结论:妊娠早期母体吸烟、接触农药杀虫剂、胎儿低出生体质量可能增加胎儿尿道下裂的发生风险。","doi":"10.3969/j.issn.1000-2294.2010.11.005","pmid":"","date":"2010","journal":"南昌大学学报（医学版）","authors":"朱遵伟; 孟栋良; 张明英; 黎源; 曾涛; 王金根; 何洁卿; 崔苏萍"},{"record_id":"R-SQ5WXT8T","title":"Study of anogenital distance as a diagnostic tool for prostate cancer","abstract":"Introduction and objective: The distance from the genitals to the anus (anogenital distance [AGD]) reflects androgen concentration during prenatal development in mammals. At the present time, there is only one study suggesting the relationship between AGD and risk of prostate cancer (CaP). The goal of this study was to assess the performance and clinical utility of AGD, as a biomarker of prenatal androgenic milieu, and risk of CaP in a larger population, in CaP diagnosis.\n   Material and methods: A case-control study was conducted on 260 men seen in a hospital outpatient clinic where underwent a physical and andrological examination and completed a brief questionnaire. CaP patients were confirmed by biopsy of the tumor. Controls were men without CaP seen in the urology outpatient clinic for routine examinations. Two variants of AGD (from the anus to the posterior base of the scrotum [AGDAs] and to the cephalad insertion of the penis [AGDAP]) were measured. Parametric and non-parametric tests and receiver operating characteristic (COR) analyses were used to determine relationships between AGD and presence of CaP.\n   Results: The highest area under the curve (0.69; 95% cl 0.60 to 0.78 and 0.69; 95% CI 0.61 to 0.77) was obtained for the Gleason = 7 subgroup with the AGDAs and AGDAP measurement, with a sensitivity and specificity of 83% and 55%, and 91% and 41%, the predictive positive value of 39% and 35% and negative value of 90% and 93% respectively.\n   Conclusion: AGD may be a useful clinical tool for the CaP diagnosis. (C) 2018 Asociacion Espanola de Andrologia, Medicina Sexual y Reproductiva. Published by Elsevier Espana, S.L.U. All rights reserved.","doi":"10.1016/j.androl.2018.03.001","pmid":"","date":"2019 APR-JUN","journal":"REVISTA INTERNACIONAL DE ANDROLOGIA","authors":"Oñate-Celdrán J; Arense-Gonzalo JJ; Mendiola J; Samper-Mateo P; Sánchez-Rodríguez C; García-Escudero D; Torres-Roca M; Vilchez-Costas A; Adoamnei E; Torres-Cantero AM"},{"record_id":"R-F2EKPSIT","title":"Performance of ultrasound in detecting fetal hypospadias during pregnancy: a pooled analysis.","abstract":"Background Opinions regarding the role and value of ultrasound in the diagnosis of prenatal hypospadias are diverse. Although hypospadias is not a fatal malformation, a higher degree of severity exerts a significant impact on children's physiology and psychology. On the other hand, hypospadias may be accompanied by accompanying anomalies, syndromic conditions, and fetal growth restriction (FGR). This study aimed to systematically assess the value of ultrasound in the prenatal diagnosis of hypospadias. Methods In the systematic review and meta-analysis, we searched PubMed, Web of Science, Scopus, Embase, and China National Knowledge Infrastructure (CNKI) databases until June 30, 2024. The key terms included: hypospadias, ultrasound, and prenatal diagnosis. Studies were assessed following the eligibility criteria, and the data from the included studies were extracted through a standardized protocol. The primary outcomes focused on the positive predictive value (PPV), accuracy, sensitivity, and specificity of ultrasound for detecting fetal hypospadias. The Quality Assessment of Diagnostic Accuracy Studies-2 (QUADAS-2) scale was used to assess the risk of bias. The PPV was calculated using the bootstrap method. When five or fewer studies were pooled, a random-effect model based on the Hartung-Knapp-Sidik-Jonkman (HKSJ) method was used as a meta-analysis strategy to evaluate the overall effect. Sensitivity and specificity were pooled using a Summary Receiver Operating Characteristic (SROC) curve. The protocol was registered with PROSPERO (CRD42024586840). Findings A total of nine studies with 600 cases were included in the systematic review. The pooled median gestational age of the included studies was 27.64 +/- 3.15 weeks. The overall PPVs of two-dimensional ultrasound (2DUS) in diagnosing fetal hypospadias and external genital malformations were 81% (95% confidence interval (CI): 77%- 85%) and 88% (95% CI: 86%-91%), respectively. Upon in-depth analysis of the five studies, the accuracy of 2DUS combined with three-dimensional ultrasound (3DUS) was 84% (95% CI: 78%-89%), and that of 2DUS alone was 74% (95% CI: 69%-78%). The difference between the two methods was 10%. The pooled sensitivity of 2DUS combined with 3DUS in diagnosing fetal hypospadias was 86% (95% CI: 79%-93%), the specificity was 77% (95% CI: 69%-86%), and the area under the curve (AUC) was 0.86 (95% CI: 0.83-0.89). Interpretation This is the first diagnostic meta-analysis to comprehensively evaluate the detection of fetal hypospadias using ultrasound during pregnancy, indicating that ultrasound is indeed of significant value in the prenatal diagnosis of hypospadias. More research is needed to validate and enhance current research findings and offer more comprehensive guidance for future clinical practice. Funding This work was supported by the Natural Science Foundation Project of Chongqing, Chongqing Science and Technology Commission (CSTB2022NSCQ-MSX1001) and the Program for Youth Innovation in Future Medicine, Chongqing Medical University (W0109). Copyright (c) 2025 The Authors. Published by Elsevier Ltd. This is an open access article under the CC BY license (http://creativecommons.org/licenses/by/4.0/).","doi":"10.1016/j.eclinm.2025.103091","pmid":"","date":"2025","journal":"eClinicalMedicine","authors":"Zhang Qiang; Chen Hongsong; Wang Chong; Liu Zhenmin; Wei Guanghui; Zhang Zhicheng; Liu Xing"},{"record_id":"R-FSDKFFWT","title":"Racial/ethnic differences in the birth prevalence of congenital anomalies in the United States","abstract":"Objectives: This work aimed to analyze a single large representative population to determine racial/ethnic differences in the prevalence of congenital anomalies (CA). Design: This is a population-based comprehensive analysis of racial/ethnic differences in the prevalence of CA diagnoses. We reviewed all live births in the 2008 Nationwide Inpatient Sample (NIS) database and determined the birth prevalence of 55 selected CA diagnoses in Caucasians. We then calculated the relative risk of these CA diagnoses in African American, Hispanics, and Asians relative to Caucasians. Result: Overall CA prevalence was 29.2 per 1000 in a cohort of 1,048,252 live births, of which 51% were Caucasians. Compared with Caucasians, risk of overall CA was lower in African Americans (RR=0.9, CI: 0.8-0.9) and Hispanics (RR=0.9, CI: 0.8-0.9). Risk of overall CA was similar in Caucasians and Asians. Relative to the Caucasians, African Americans had lower risk of cardiac, genitourinary, and craniofacial CA but higher risk of musculoskeletal anomalies. Hispanics had lower risk of genitourinary and gastrointestinal CA. Asians had higher risk of craniofacial and musculoskeletal CA. Conclusions: Observed racial/ethnic differences in risk of CA may be related to genetic susceptibilities, cultural or social differences that could modify exposures, or many potential combinations between susceptibilities and exposures. © 2015, Walter de Gruyter GmbH. All rights reserved.","doi":"10.1515/jpm-2013-0344","pmid":"","date":"2015","journal":"Journal of Perinatal Medicine","authors":"Egbe A.; Lee S.; Ho D.; Uppu S.; Srivastava S."},{"record_id":"R-NCU4PI4P","title":"Functional evaluation of one-stage urethroplasty with parameatal foreskin flaps repair of hypospadias using uroflowmetry.","abstract":"Background: Uroflowmetry is a simple, accurate and non-invasive test. In the present study, we aimed to determine the role of uroflowmetry in the evaluation of the functional results of one-stage urethroplasty with parameatal foreskin flaps (OUPF) technique.\n   Methods: Twenty-one children who had undergone OUPF repair at our clinic were selected. Selection criteria were that patients were toilet trained and had no fistula. Uroflowmetry was performed using a rotating disk sensor. The maximum flow rate (Q(max) ) and average flow rate (Q(ave) ) were plotted against body surface related flow rate nomograms. The upper 95% tolerance limits for the 5th, 10th, 15th, 20th and 25th percentiles of the normal population were used for comparison. The flow pattern was classified as bell ring, plateau or intermittent.\n   Results: The median age at the first uroflowmetry was 4.7 years (range 2.5-8.6) and the mean postoperative follow-up period was 25 months (range 1-58). Twelve children had Q(max) above the 25th, six between the 5th and 25th and three less than the 5th percentiles of the normal population. A normal bell-shaped flow curve was obtained in 17 (80.6%) of the children. Of the three children with Q(max) below the 5th percentile, two children had a plateau flow pattern and were found to have a urethal stricture. Dilation was performed successfully, after which the Q(max) returned to the normal range and the symptoms disappeared.\n   Conclusion: The OUPF technique provided satisfactory functional results for hypospadias repair. We advocate the use of uroflowmetry for routine postoperative follow-up.","doi":"10.1046/j.1442-2042.2003.00636.x","pmid":"","date":"2003","journal":"International Journal of Urology","authors":"Anwar Ahmed; Kurokawa Yasushi; Takahashi Masayuki; Yamamoto Yasuyo; Kanayama Hiro-Omi; Kagawa Susumu"},{"record_id":"R-NND62XTU","title":"Paediatric urology: GWAS identifies hypospadias loci.","abstract":"Persisting high levels of cardiovascular mortality in Russia present a specific case among developed countries. Application of cardiovascular risk prediction models holds great potential for primary prevention in this country. Using a unique set of cohort follow-up data from Moscow and Saint Petersburg, this study aims to test and recalibrate the Systematic Coronary Risk Evaluation (SCORE) methods for predicting CVD mortality risks in the general population. The study is based on pooled epidemiological cohort data covering the period 1975-2001. The algorithms from the SCORE project were used for the calibration of the SCORE equation for the Moscow and St. Petersburg populations (SCORE-MoSP). Age-specific 10-year cumulative cardiovascular mortality rates were estimated according to the original SCORE-High and SCORE-Low equations and compared to the estimates based on the recalibrated SCORE-MoSP model and observed CVD mortality rates. Ten-year risk prediction charts for CVD mortality were derived and compared using conventional SCORE-High and recalibrated SCORE-MoSP methods. The original SCORE-High model tends to substantially under-estimate 10-year cardiovascular mortality risk for females. The SCORE-MoSP model provided better results which were closer to the observed rates. For males, both the SCORE-High and SCORE-MoSP provided similar estimates which tend to under-estimate CVD mortality risk at younger ages. These differences are also reflected in the risk prediction charts. Using non-calibrated scoring models for Russia may lead to substantial under-estimation of cardiovascular mortality risk in some groups of individuals. Although the SCORE-MoSP provide better results for females, more complex scoring methods involving a wider range of risk factors are needed.","doi":"","pmid":"","date":"2014","journal":"Nature reviews. Urology","authors":"Annette Fenner"},{"record_id":"R-H2TV8YL6","title":"Development and verification of machine learning model based on anogenital distance, penoscrotal distance, and 2D:4D finger ratio before puberty to predict  hypospadias classification.","abstract":"Objectives: To describe the anatomical abnormalities of hypospadias before puberty using current commonly used anthropometric index data and predict postoperative diagnostic classification. Methods: Children with hypospadias before puberty who were initially treated at Sichuan Provincial People's Hospital from April 2021 to September 2022 were selected. We recorded their preoperative penoscrotal distance, anogenital distance, 2D:4D finger ratio, and postoperative hypospadias classification. The receiver operating character curve was used for univariate analysis of the diagnostic predictive value of each index for hypospadias classification in the training set. Binary logistic regression, random forest, and support vector machine models were constructed. In addition, we also prospectively collected data from October 2022 to September 2023 as a test set to verify the constructed machine learning models. Results: This study included 389 cases, with 50 distal, 167 midshaft, and 172 proximal cases. In the validation set, the sensitivity of the binary LR, RF, and SVM was 17%, 17% and 0% for identifying the distal type, 61%, 55% and 64% for identifying the midshaft type, and 56%, 60% and 48% for identifying the proximal type, respectively. The sensitivity of the three-classification RF and SVM models was 17% and 17% for distal type, 64% and 73% for midshaft type, 60% and 60% for proximal type, respectively. In the Testing set, the sensitivity of the binary LR, RF and SVM was 6%, 0% and 0% for identifying the distal type, 64%, 55% and 66% for identifying the midshaft type, and 48%, 62% and 39% for identifying the proximal type, respectively. The sensitivity of the three-classification RF and SVM models was 12% and 0% for distal type, 57% and 77% for midshaft type, and 65% and 53% for proximal type, respectively. Compared with binary classification models, the sensitivity of the three-classification models for distal type was not improved. Conclusion: Anogenital distance and penoscrotal distance have a favorable predictive value for midshaft and proximal hypospadias, among which AGD2, with higher test efficiency and stability, is recommended as the preferred anogenital distance indicator. The 2D:4D finger ratio (RadioL, RadioR) has little predictive value for hypospadias classification. 2024 He, Yang, Tang and Wang.","doi":"10.3389/fped.2024.1297642","pmid":"","date":"2024","journal":"Frontiers in Pediatrics","authors":"He Zirong; Yang Bo; Tang Yunman; Wang Xuejun"},{"record_id":"R-48H94TIH","title":"男性尿道重建手术术后切口感染相关因素分析及预测模型建立","abstract":"研究目的: 通过回顾性分析单中心10年期间男性尿道重建手术后切口感染的流行病学特征及病原体分布,筛选出术后切口感染的独立危险因素,进而构建并验证术后切口感染风险预测列线图模型,明确感染与并发症(尿道皮肤瘘、尿道狭窄、成形尿道裂开)的关联,为临床个体化感染防控、减少术后并发症提供循证依据。 研究方法: 回顾性分析2014年1月至2024年1月在某院行尿道重建手术的2306例患者的临床资料,其中尿道下裂765例、尿道皮肤瘘261例、尿道狭窄1280例(开放手术470例)。收集患者一般资料、手术相关的各项数据、实验室检查结果及预后信息。采用单因素及多因素Logistic回归分析筛选独立危险因素,基于回归结果构建列线图预测模型,通过校准曲线(Bootstrap自采样200次)及ROC曲线(计算AUC)评估模型区分度与校准度。 研究结果: 尿道下裂、尿道皮肤瘘、尿道狭窄开放手术后切口感染率分别为8.2%(63/765)、8.0%(21/261)和 10.2%(48/470)。 整体患者多因素分析显示:手术时年龄>12岁(OR=5.08,95%CI 2.88-8.99)、尿道手术史(OR=1.24,95%CI 1.09-1.41)为独立危险因素;BMI 18.5-24.0 为保护因素(OR=0.46,95%CI 0.28-0.73)。构建的列线图AUC=0.723,校准曲线平均绝对误差0.007。 尿道下裂患者中,年龄>12岁(OR=4.15)、疾病分型(近端型)(OR=2.91)、尿道手术史(OR=1.48)、术后留置尿管(OR=2.28)为独立危险因素,构建的列线图AUC=0.823,校准曲线平均绝对误差=0.024。 尿道皮肤瘘患者中,年龄>12岁(OR=6.07)、尿道手术史(OR=2.24)、手术切口(Y-V切口)(OR=6.47)、瘘口≥3mm(OR=4.96)、合并尿道狭窄(OR=7.98)为独立危险因素,列线图AUC=0.889,校准曲线平均绝对误差=0.032。 阴茎体部尿道重建患者中年龄>12岁(OR=6.75)、自身组织加盖(OR=2.12)和术后留置尿管(OR=1.69)是独立危险因素,而BMI 18.5-24.0(OR=0.52)为保护因素。列线图AUC=0.742,校准曲线平均绝对误差=0.008。 球部尿道及后尿道重建患者中,尿道手术史(OR=1.99)、术后泌尿系感染(OR=11.19)、其他原因导致的尿道狭窄(OR=7.11)为独立危险因素,BMI 18.5-24.0为保护因素(OR=0.14),列线图AUC=0.871,校准曲线平均绝对误差=0.036。 病原学结果:术前尿细菌培养阳性1248例,革兰阴性杆菌占65.4%(大肠埃希菌为主,29.2%),革兰阳性球菌占27.6%(粪肠球菌为主,35.5%)。耐药性分析显示大肠埃希菌对左氧氟沙星耐药率高达92.2%,对头孢呋辛80.2%,但对碳青霉烯类(亚胺培南4.3%)及阿米卡星(3.4%)保持高度敏感。切口感染分泌物培养结果与尿细菌培养谱基本一致。 感染出现时间:尿道狭窄组中位4.5天,早于尿道下裂组(6天,P=0.001)。感染患者中,尿道下裂组41.3%继发尿道皮肤瘘、7.9%继发尿道狭窄、14.3%出现成形尿道裂开;尿道皮肤瘘组61.9%出现瘘管复发、14.2%出现尿道狭窄。 研究结论: 男性尿道重建手术后切口感染发生率较高,不同类型的尿道手术的危险因素谱有所不同。病原菌以革兰阴性杆菌居多,耐药形势十分严峻。切口感染会显著增加并发症风险。构建的列线图模型预测效能良好,可用于术前高危患者识别和提前干预。","doi":"10.27003/d.cnki.gojyu.2026.001155","pmid":"","date":"2026","journal":"","authors":"林艺"},{"record_id":"R-DGSI45KZ","title":"RENAC: National Registry of Congenital Anomalies in Argentina","abstract":"Introduction: The National Registry of Congenital Anomalies (Registro Nacional de Anomalías Congénitas, RENAC) is a hospital-based surveillance system for newborn infants with major morphological congenital anomalies (CAs). The objective of this study was to describe the characteristics and operation of the RENAC registry and the prevalence at birth of 56 specific selected CAs, compared to other registries. Population and Methods: The organization of the RENAC registry was initiated in public hospitals with 1000 or more births per year or which are the referral hospitals in a determined health region. Neonatologists are in charge of data collection, and a central coordination department is in charge of encoding, statistical analyses and regular reports. The RENAC registry uses an online forum for data submission and for guidance and interaction regarding the initial management of cases. Results: Between November 1st, 2009 and June 30th, 2012, 98 hospitals were included in the registry, the annual coverage of these hospitals is 65% in the public sector and 35% of births in Argentina. In this period, 294 005 newborn infants were examined, and 5165 cases with major CAs were detected (1.76%; 95% CI: 1.71-1.80). The most frequent CAs were septal heart defects (prevalence per 10 000:28.6), Down's syndrome (prevalence per 10 000:19.2), cleft lip +/- palate (prevalence per 10 000:12), and a set of neural tube defects (prevalence per 10 000:11.9). Conclusions: The RENAC has reached a high coverage in the public sector and the differences in prevalence with other registries can be related to operational aspects or actual differences, depending on the case. The RENAC deals with the collection, analysis and dissemination of information about CAs in Argentina, and also contributes with local interventions.","doi":"10.5546/aap.2013.484","pmid":"","date":"2013","journal":"Archivos Argentinos de Pediatria","authors":"Groisman B.; Bidondo M.P.; Barbero P.; Gili J.A.; Liascovich R."},{"record_id":"R-DLEWQU5Z","title":"Genotype-phenotype analysis of NR5A1/SF1 mutations by functional in vitro studies","abstract":"Background: The steroidogenic Factor 1 (SF1, NR5A1) is one of the key factors involved in gonadal and adrenal development and steroidogenesis. Until now, over 50 mutations were described in different phenotypes of XY disorders of sex development (DSD) such as complete gonadal dysgenesis, severe and mild partial gonadal dysgenesis, hypospadias, infertility and bilateral anorchia. So far, no genotype-phenotype correlation could be demonstrated. Objective and hypotheses: To investigate genotype-phenotype correlation SFl-mutations by functional in-vitro studies. Method: Investigation of the transcriptional activity of different SF1 missense mutations on central promoters of gonadal development in a homogeneous experimental set up by Dual-Glo luciferase assays in HEK and Sertoli cells. Mutations of different structural region from patients with phenotypes ranging from infertility to complete gonadal dysgenesis were chosen. TESCO, the initiator of testis determination and the promoters of CYP11A1, reflecting steroidogenesis and Leydig cell function and AMH representing Sertoli cell function were used as reporter. Results: SF1 missense mutations in the DNA-binding (p.E35G, p.R62C) and ligand-binding domain (p.L376F) leading to partial and complete gonadal dysgenesis showed a significant reduced ability to activate TESCO and the CYP11A1 promoter. SF1 mutations in the hinge-region (p.P131L, p.P191C) leading to infertility showed only moderate reduced ability to activate TESCO and minor reduced activation of the CYP11A1 promoter. None of the mutations did show significant reduction of transcriptional activity of the AMH promoter. Conclusion: The transcriptional activity of the different SF1 mutations on the TESCO and CYP11A1 promoter reflect the severity of clinical expression of gonadal dysgenesis and steroidogenic function in-vitro. Functional studies of SF1 mutations using TESCO and the CYP11A1 promoter can be helpful predictive models for phenotypes in-vitro.","doi":"10.1159/000449142","pmid":"","date":"2016","journal":"Hormone Research in Paediatrics","authors":"Astudillo R.; Bashamboo A.; Kleinau G.; Biebermann H.; Krude H.; Köhler B."},{"record_id":"R-4X2GGR7K","title":"Circapproved: Digital Pattern Recognition via Artificial Neural Network for the Identification of Normal Penis Parameters for Circumcision Eligibility Using Mobile App","abstract":"Background: Circumcision is a prevalent surgical procedure performed for medical, cultural, and religious reasons, requiring a thorough assessment of penile anatomy to determine eligibility, especially for identifying contraindications such as congenital anomalies. This study focuses on developing an artificial intelligence (AI) based digital pattern recognition system to accurately identify normal penile parameters for circumcision eligibility using a mobile application. Methods: Utilizing an Artificial Neural Network (ANN), the AI model was trained on digital images captured by parents or healthcare personnel from dorsal, lateral, and ventral views of the penis. The training employed advanced techniques such as image augmentation and transfer learning to overcome the challenges posed by a limited dataset. Ethical guidelines were strictly adhered to, with informed consent obtained from all participants, ensuring the study's compliance with the Declaration of Helsinki. Results: The AI model, integrated into the Circapproved mobile app, demonstrated high accuracy in classifying normal and abnormal penile conditions, achieving 88.89 % accuracy for the dorsal view, 90.91 % for the lateral view, and 92.5 % for the ventral view. The development pipeline included data preprocessing, data splitting, and augmentation, with the AI model being deployed on a cloud-based platform to ensure scalability and accessibility. The results indicate significant potential for the AI-driven mobile application to facilitate large-scale screening and streamline the circumcision approval process, particularly in resource-limited settings. Conclusion: This approach highlights the potential of AI integration for enhancing the precision of circumcision approval process. Future research should focus on further addition to the dataset to increase model accuracy. (c) 2025 Elsevier Inc. All rights are reserved, including those for text and data mining, AI training, and similar technologies.","doi":"10.1016/j.jpedsurg.2025.162358","pmid":"","date":"2025 JUL","journal":"JOURNAL OF PEDIATRIC SURGERY","authors":"Wahyudi I; Utomo CP; Djauzi S; Fathurahman M; Situmorang GR; Rodjani A; Raharja PAR; Yonathan K; Santoso B; Khresna D; Pratama MW; Insani N; Raditya M"},{"record_id":"R-Q8ND3NB7","title":"Neural network non-linear modeling to predict hypospadias genotype-phenotype correlation.","abstract":"Introduction\n   Hypospadias is an abnormal development of the urethral, ventral skin and corporeal bodies. Urethral meatus and ventral curvature have been historically the landmarks to define clinical severity. Genotyping has never been explored as a clinical predictor. Available reports have demonstrated a correlation between genetic mutations and syndromic hypospadias with poor surgical outcomes. We hypothesize that inclusion of genotyping can serve at classifying all types of hypospadias. We present the use of neural network algorithm to evaluate phenotype/genotype correlations and propose its potential clinical applicability.\n   Methods\n   A systematic review was performed from January 1974 to June 2022. Literature was retrieved from Medline, Embase, Web of Science and Google Scholar. Included manuscripts were those that had an explicit anatomical description of hypospadias phenotype (urethral meatus location following an anatomical description) and a defined genotype (genetic mutation) description. Cases with more than one variant/mutation were excluded. A comprehensive phenotype-genotype statistical analysis using neural network non-linear data modeling SPSS (TM) was performed.\n   Results\n   Genotype-Phenotype analysis was performed on 1731 subjects. Of those, 959 (55%) were distal and 772 (45%) proximal. 49 genes with mutations were identified. Neural network clustering predicted better for coronal (90%) and glanular (80%), and lowest for midshaft (22%) and perineal (45%). Using genes as predictor factor only, the model was able to highly and more accurately predict the phenotype for coronal and glanular hypospadias. The following genotypes showed association to a specific phenotype: AR gene n.2058G > A for glanular (p\u003c0.0001), n.480C > T for coronal (p = 0.034), R840C for perineal (p = 0.002), MAMLD1 gene c.2960C > T for coronal (p\u003c 0.0001), p. G289S for glanular (p\u003c0.0001), gene SRD5A2 607G > A for scrotal (p\u003c0.0001), c16C > T for penoscrotal (p\u003c0.0001), c59 T > c for perineal (p = 0.042), V89L for midshaft and scrotal (p\u003c0.0001, p = 0.041; respectively).\n   Discussion\n   Hypospadias phenotype has always been described from a purely anatomical perspective. Our results demonstrate that current phenotyping has poor correlation to the genotype. Higher genotype/phenotype correlation for distal hypospadias proves the clinical applicability of genotyping these cases. The concept and classification of differences in sexual development needs to be reconsidered given high positive yield reported for distal hypospadias. Given the better predictive value of genotyping in correlation to the phenotype, future efforts should be directed towards using the genotype.\n   Conclusion\n   Hypospadias has poor phenotype/genotype correlation. Sequencing all hypospadias phenotypes may add clinical value if used in association to other predictive variables. Neural network analysis may have the ability to combine all these variables for clinical prediction.\n   [GRAPHICS]\n   .","doi":"10.1016/j.jpurol.2023.01.005","pmid":"","date":"2023","journal":"Journal of pediatric urology","authors":"Fernandez Nicolas; Chua Michael; Villanueva Juliana; Varela Daniela; Bagli Darius; Shnorhavorian Margarett"},{"record_id":"R-JRETW88Y","title":"73498例新生儿出生缺陷监测分析","abstract":"目的:了解新生儿出生缺陷发生情况及相关危险因素。方法:回顾性分析2008年1月至2014年6月出生缺陷新生儿的资料。结果:研究期间共出生新生儿73 498例,其中出生缺陷新生儿777例,发生率10.6%。出生缺陷前五位依次为先天性心脏病、多指(趾)/并指(趾)、尿道下裂、唇腭裂、外耳畸形。与无出生缺陷儿相比,出生缺陷儿中男婴、早产儿、低出生体质量、双胎及多胎、常住人口比例高,差异有统计学意义(P均\u003c0.05)。影响出生缺陷的主要危险因素为服药史、孕妇自然流产史、妊娠期糖尿病和家族史。结论:婚前、孕产期保健,减少早产、双胎及多胎、低出生体质量的发生,提高产前诊断技术水平,做好出生缺陷监测可减少出生缺陷的发生。","doi":"10.3969/j.issn.1000-3606.2015.06.013","pmid":"","date":"2015","journal":"临床儿科杂志","authors":"杨旻; 汪吉梅; 钱蓓倩; 戴家乐; 庄晓磊; 陈爱菊; 孟永勤"},{"record_id":"R-I5628FAW","title":"Analysis of the correlation between sex hormones and micropenis after mild hypospadias surgery in children","abstract":"Objective To analyze the correlation between sex hormone levels and micropenis after mild hypospadias surgery in children. Methods A case control study was carried out.The clinical data of 71 children aged 1 to 13 years who underwent mild hypospadias surgery at the First Affiliated Hospital of Xinxiang Medical University from April 2022 to April 2024 were analyzed.Preoperatively, the children were divided into a mild hypospadias group (Group A) and a mild hypospadias with micropenis group (Group B) based on the stretched penile length (SPL).Prolactin, follicle-stimulating hormone (FSH), luteinizing hormone (LH), progesterone, and testosterone (TES) levels of the 2 groups were measured.Multivariate Logistic regression analysis was used to construct a risk prediction model.The discrimination capability of the model was evaluated using the receiver operating characteristic (ROC) curve.SPL and sex hormone levels were measured again 6 months after surgery.The children were divided into a normal penile group (Group AA) and a micropenis group (Group BB) after mild hypospadias according to SPL.Multivariate Logistic regression analysis was used to construct a risk prediction model, which was evaluated using the ROC curve. Results The levels of FSH, LH and TES in group A before the operation were 3.28(2.02, 4.46) IU/L, 0.53(0.25, 0.79) IU/L and 25.24(17.94, 36.67) ng/dL, respectively, and those in group B were 1.42(1.10, 1.84) IU/L, 0.14(0.09, 0.23) IU/L and 15.73 (12.92, 17.00) ng/dL, respectively.The difference was all statistically significant (all P\u003c0.05).Multivariate Logistic regression analysis showed statistical significance (OR=0.515, 95%CI: 0.271-0.977; OR=0.035, 95%CI: 0.002-0.542; OR=0.883, 95%CI: 0.796-0.980).The area under the ROC curve (AUC) of the prediction model was 0.906, with a sensitivity of 75.00% and a specificity of 95.74%.The levels of FSH, LH and TES in the postoperative AA group were 2.97 (1.88, 4.28) IU/L, 0.46 (0.23, 0.78) IU/L and 20.92 (17.34, 33.27) ng/dL, respectively.The median levels of FSH, LH and TES in the BB group were 1.52 (1.27, 1.82) IU/L, 0.17 (0.12, 0.26) IU/L and 15.08(11.68, 16.68) ng/dL, respectively.The difference was all statistically significant (all P\u003c0.05).Multivariate Logistic regression analysis showed statistical significance (OR=0.484, 95%CI: 0.236-0.992; OR=0.061, 95%CI: 0.004-0.939; OR=0.891, 95%CI: 0.795-0.999).The AUC of the prediction model constructed was 0.877, with a sensitivity of 94.12% and a specificity of 68.52%. Conclusions Lower FSH, LH and TES levels are risk factors for the micropenis after mild hypospadias surgery, and preoperative hormone levels have higher predictive value. © 2025 Chinese Medical Association.","doi":"10.3760/cma.j.cn101070-20241120-00770","pmid":"","date":"2025","journal":"Chinese Journal of Applied Clinical Pediatrics","authors":"Wang J.; Zhang H.; Guo L.; Liu H.; Liu H.; Jia R.; Liu Y.; Su D.; Song C."},{"record_id":"R-BH9VMRBY","title":"In utero exposure to an AR antagonist plus an inhibitor of fetal testosterone synthesis induces cumulative effects on F1 male rats","abstract":"Risk assessments are typically conducted on a chemical-by-chemical basis; however, many regulatory bodies are developing frameworks for assessing the cumulative risk of chemical mixtures of chemicals. The current investigation examined how chemicals that disrupt rat sex differentiation via two diverse mechanisms disrupt F1 male rat reproductive development, when administered together orally on days 14-18 of gestation. Experiment 1 used a mixture of 50. mg/kg-d procymidone and 500. mg/kg-d dibutyl phthalate (DBP), whereas experiment 2 used 150. mg/kg-d procymidone and 1125. mg/kg-d DBP (top dose), or 0, 4.17, 8.33, 16.7, 33.3, 50, 66.7, and 83.3% of the top dose. When we compared the dose and response addition predictions to the observed effects we found that dose addition models were more accurate than response addition models, indicating that compounds that act by different mechanisms of toxicity produce cumulative dose-additive effects. © 2010.","doi":"10.1016/j.reprotox.2010.06.001","pmid":"","date":"2010","journal":"Reproductive Toxicology","authors":"Hotchkiss A.K.; Rider C.V.; Furr J.; Howdeshell K.L.; Blystone C.R.; Wilson V.S.; Gray Jr L.E."},{"record_id":"R-4VHYT4J3","title":"Prenatal environmental risk factors for genital malformations in a population of 1442 French male newborns: a nested case-control study.","abstract":"BACKGROUND: Over the past decades, an increasing trend in male external genital malformations such as cryptorchidism and hypospadias has led to the suspicion  that environmental chemicals are detrimental to male fetal sexual development.  Several environmental pollutants, including organochlorine pesticides,  polychlorinated biphenyls, bisphenol A, phthalates, dioxins and furans have  estrogenic and anti-androgenic activity and are thus considered as  endocrine-disrupting chemicals (EDCs). Since male sex differentiation is  critically dependent on the normal production and action of androgens during  fetal life, EDCs may be able to alter normal male sex differentiation. OBJECTIVE:  The objective of this study was to determine the incidence of external genital  malformations in a population of full-term newborn males in southern France. We  also performed a case-control study to identify the risk factors for male  external genital malformations, with a focus on parental occupational exposure to  EDCs. METHODS: Over a 16-month period, 1615 full-term newborn males with a birth  weight above 2500 g were registered on a level-1 maternity ward, and the same  pediatrician systematically examined 1442 of them (89%) for cryptorchidism,  hypospadias and micropenis. For every male newborn with genital malformation, we  enrolled nearly two males matched for age, parity and term. All parents of the  case and control newborns were interviewed about pregnancy aspects, personal  characteristics, lifestyle and their occupational exposure to EDCs using a  detailed questionnaire. RESULTS We report 39 cases of genital malformation  (2.70%), with 18 cases of cryptorchidism (1.25%), 14 of hypospadias (0.97%), 5 of  micropenis (0.35%) and 2 of 46,XY disorders of sexual differentiation (DSD;  0.14%). We observed a significant relationship between newborn cryptorchidism,  hypospadias or micropenis and parental occupational exposure to pesticides [odds  ratio (OR) = 4.41; 95% confidence interval (95% CI), 1.21-16.00]. Familial  clustering for male external genital malformations (OR = 7.25; 95% CI,  0.70-74.30) and medications taken by mothers during pregnancy (OR = 5.87; 95% CI,  0.93-37.00) were associated with the risk of cryptorchidism, hypospadias and  micropenis, although the association was not statistically significant.  CONCLUSIONS: Although the causes of male genital malformation are multifactorial,  our data support the hypothesis that prenatal contamination by pesticides may be  a potential risk factor for newborn male external genital malformation and it  should thus be routinely investigated in all undervirilized newborn males.","doi":"10.1093/humrep/der283","pmid":"","date":"2011","journal":"Human Reproduction","authors":"Gaspari Laura; Paris Françoise; Jandel Claire; Kalfa Nicolas; Orsini Mattea; Daurès Jean Pierre; Sultan Charles"}],"translations":{"R-E4URRJVE":{"title_zh":"阴茎人体测量学","abstract_zh":"尿道下裂患者在长期随访中最常见的主诉是阴茎短小，所有儿科医生和临床医生也经常遇到家长询问孩子阴茎标准大小的问题。在尿道下裂修复的诊疗中，对阴茎大小的关注远远不足。阴茎及阴茎头的大小是决定尿道下裂手术结局的重要变量。阴茎形态异常可能影响人际关系，也可能随着儿童成长至成年而导致情绪困扰。即使属于正常变异，患儿家长或患者也可能对阴茎大小存在误解。另一方面，必须排除小阴茎。阴茎在形态和功能方面正常，但长度比该年龄儿童的平均长度低超过 2.5 个标准差（SD），即称为小阴茎。有了明确的阴茎测量列线图，就可以就阴茎大小向患者及家长提供咨询。然而，不同种族和族裔人群的体格存在差异，因此阴茎大小也可能不同。为确定不同人群的标准阴茎尺寸，可能需要分别制定阴茎尺寸图表。本章将提供有关阴茎大小及其与年龄和 BMR 关系的基准资料，以帮助临床医生及时治疗。\n© 编者（如适用）及作者，独家许可予 Springer Nature Singapore Pte Ltd.，2022 年。"},"R-RE3SG893":{"title_zh":"内分泌干扰化学物的职业暴露及其他父母因素与尿道下裂和隐睾发生的关系：一项病例对照研究","abstract_zh":"研究目的\n内分泌干扰化学物（EDCs）是能够改变内分泌系统功能（包括发育过程调节）的外源性物质。本研究旨在探讨 EDCs 暴露及其他父母因素与尿道下裂和隐睾病因之间的关联。\n方法\n开展了一项病例对照研究。病例组（n = 210）为在 18 个月期间到作者所在医院就诊、年龄为 6 个月至 14 岁、确诊为尿道下裂或隐睾的婴儿；对照组（n = 210）为同一时期到同一医院门诊就诊、年龄范围相同且无任何泌尿系统疾病的婴儿。研究对象的选择独立于暴露情况。通过面对面访谈，系统收集病例组和对照组父母职业性 EDCs 暴露及其他社会人口学变量的数据。采用 logistic 回归估计粗比值比和调整后比值比（OR）及其 95% 置信区间（CI），以控制混杂。具体而言，构建了三个以二分类结局为因变量的最终模型：一个针对隐睾，一个针对尿道下裂，第三个将两种畸形合并考虑。采用 Hosmer-Lemeshow 检验评估模型拟合优度。通过估计受试者工作特征曲线下面积（AUC）及其 95% CI，确定模型的判别准确性（DA）。\n结果\n发现以下因素存在关联：母亲高龄（调整后 OR = 1.82；95% CI：1.14–2.92）、母亲孕期使用保胎药（OR = 5.40；95% CI：1.40–38.5）及其他药物（OR = 2.02；95% CI：1.31–3.16）、母亲和父亲职业性接触 EDCs（分别为 OR = 4.08；95% CI：2.03–8.96 和 OR = 3.90；95% CI：2.41–6.48）、父亲吸烟（OR = 2.0；95% CI：1.33–2.99），以及父亲患有泌尿系统疾病（OR = 2.31；95% CI：1.15–4.90）。母亲和父亲较高的教育水平可能对隐睾具有保护作用（分别为 OR = 0.47；95% CI：0.28–0.76 和 OR = 0.63；95% CI：0.42–0.93）。全样本模型（AUC = 0.75；95% CI：0.70–0.79）、隐睾模型（AUC = 0.76；95% CI：0.71–0.82）及尿道下裂模型（AUC = 0.75；95% CI：0.69–0.81）的 DA 均为中等偏高。\n结论\n高龄、父母某些职业性 EDCs 暴露、某些药物的使用、吸烟及父亲的泌尿系统疾病史，可能增加这些畸形发生的风险，并可用于预测其发生。需要样本量更大的研究，以评估单项职业性 EDCs 暴露及药物与这些畸形之间的关联。"},"R-CVIUDER6":{"title_zh":"2,3,7,8-四氯二苯并对二噁英对雄性生殖影响的动物毒理学研究：数据分析与健康效应评价","abstract_zh":"2,3,7,8-四氯二苯并对二噁英（TCDD）是一种众所周知的环境毒物，可在环境中存在多年。然而，其对雄性生殖系统的影响尚未得到明确阐述。我们对 TCDD 对啮齿类动物雄性生殖系统的影响进行了荟萃分析。结果显示，TCDD 暴露降低了睾丸重量（加权均数差［WMD］：−0.035，95% 置信区间［CI］：−0.046 至 −0.025）、精子计数（WMD：−35，95% CI：−42.980 至 −27.019）以及血液睾酮浓度（WMD：−0.171，95% CI：−0.269 至 −0.073）。根据我们的研究结果，直接或间接暴露于 TCDD 均可损伤啮齿类动物的雄性生殖系统。为进一步探究 TCDD 对人类的潜在危害，需要开展更多与人类有关的研究。\n版权所有 © 2021 Zhang、Zhou、Ren、Zhang、Wu、Wang 和 Wang。"},"R-ADEIKXTK":{"title_zh":"卡塔尔健康男童的阴茎人体测量","abstract_zh":"背景\n阴茎人体测量对于诊断生殖器异常至关重要。然而，由于这些生物测量值存在族群差异，因此需要针对特定人群的标准。\n目的\n建立卡塔尔男童首套阴茎人体测量列线图。\n研究设计\n这项前瞻性横断面研究纳入了在哈马德医疗集团接受择期包皮环切术的 210 名卡塔尔健康男童（年龄 6 个月至 12 岁；2023 年 10 月至 2024 年 10 月）。我们记录了人口学资料，并测量牵拉阴茎长度（SPL）、冠状沟处阴茎头直径（GDCL）及阴茎中段直径（MPD）。生成了分年龄列线图，并使用 SPSS v27 分析 SPL、年龄及 BMI 之间的关联。\n结果\n婴儿（6–12 个月）的平均 SPL、GDCL 和 MPD 分别为 3.75 ± 0.4 cm、1.36 ± 0.1 cm 和 1.28 ± 0.1 cm。男童（1–12 岁）的相应数值为 5.53 ± 0.9 cm、1.71 ± 0.2 cm 和 1.61 ± 0.21 cm。SPL 呈双相生长模式：从 3.75 ± 0.4 cm（6 个月至 5 岁）逐渐增加至 4.90 ± 0.9 cm（6–10 岁），随后在 11–12 岁快速增长至 7.72 ± 1.3 cm。SPL 与身高年龄相关，但与体重指数无关。\n讨论\n本研究提供了卡塔尔健康男童首套针对该人群的阴茎人体测量列线图。观察到的双相生长模式与全球趋势一致，但表现出明显的族群差异。研究局限包括缺乏 6 个月以下婴儿的数据。与国际资料比较，我们的结果与中东队列一致，但与亚洲和南美洲人群不同，凸显了建立本地参考标准的必要性。这些发现具有直接的临床适用性，可提供必要的参考数据，以避免小阴茎等状况的误诊。\n结论\n我们成功建立了卡塔尔男童按年龄划分的阴茎生物测量列线图。这些正常值数据提供了地区特异性的参考值，有助于性发育障碍的临床评估，并优化尿道下裂修复的手术决策。\n© 2026 Journal of Pediatric Urology Company。"},"R-W65Z6DUJ":{"title_zh":"包皮横行岛状皮瓣尿道成形术后并发症临床预测模型构建的多中心研究","abstract_zh":"目的\n探讨尿道下裂患儿接受包皮横行岛状皮瓣（TPIF）尿道成形术后发生并发症的危险因素，并构建术后并发症的临床预测模型。\n方法\n回顾性分析 2018 年 12 月至 2021 年 9 月在 17 家医院（包括首都医科大学附属北京儿童医院、四川省人民医院及另外 15 家医院）接受 TPIF 术治疗的 543 例尿道下裂患儿的临床资料。患儿手术年龄为 26（19，36）个月，阴茎长度为 3.5（3.0，4.0）cm，阴茎头长度为 10.0（9.0，12.5）mm，阴茎头宽度为 13.5（12.5，14.0）mm，尿道板宽度为 4（3，5）mm，尿道缺损长度为 3.5（3，3.8）cm，阴茎弯曲程度为 60（50，80）°。通过随访确定尿道瘘、尿道狭窄及尿道憩室等术后并发症。依据 TPIF 术后是否发生并发症将患儿分组，比较两组临床特征的差异。采用单因素及多因素 logistic 回归分析确定 TPIF 术后并发症的危险因素，并建立预测术后并发症的列线图模型。采用 1 000 次 Bootstrap 重抽样进行内部验证，绘制校准曲线，以受试者工作特征（ROC）曲线下面积（AUC）评估模型的判别能力，并采用 Hosmer-Lemeshow 拟合优度检验评价预测模型的校准度。\n结果\n543 例患儿术后随访时间为 42（29，61）个月，总体并发症发生率为 42.9%（233/543），其中尿道瘘 155 例（28.5%）、尿道狭窄 88 例（16.2%）、尿道憩室样扩张 48 例（8.8%）、阴茎弯曲残留或复发 1 例（1.4%）。并发症组的尿道缺损长度［3.5（3.0，4.0）cm 比 3.2（3.0，3.5）cm］、尿道缺损比值（UDR）［1.00（0.82，1.17）比 0.91（0.75，1.09）］及阴茎弯曲程度［70（60，80）° 比 60（40，70）°］均显著高于无并发症组（均 P \u003c 0.001）。单因素 logistic 回归分析显示，阴茎下弯矫正前的尿道口位置、阴茎弯曲程度、UDR 比值及尿道缺损长度是 TPIF 术后并发症的危险因素（P \u003c 0.05）。多因素 logistic 分析显示，阴茎弯曲程度（OR = 1.02，95% CI：1.01–1.03）和尿道缺损长度（OR = 1.56，95% CI：1.08–2.24）是 TPIF 术后并发症的独立危险因素。基于这些独立危险因素构建的列线图模型，其 AUC 为 0.672（95% CI：0.626–0.717），Hosmer-Lemeshow 拟合优度检验的 P 值为 0.880，表明模型拟合良好。\n结论\n这项尿道下裂多中心研究显示，阴茎弯曲程度和尿道缺损长度是 TPIF 术后并发症的独立危险因素。基于上述指标构建的术后并发症临床预测模型具有一定的区分度和校准度，可为预测术后并发症发生情况提供评估依据。\n2026，中华医学会。"},"R-LGBNG7GU":{"title_zh":"Alu 元件插入导致 FBN1 功能破坏：马凡综合征的一种新遗传病因","abstract_zh":"Alu 元件是广泛存在于人类基因组中的逆转座子，对人类基因组多样性及健康产生了影响。这些长约 300 bp 的序列可通过破坏生殖系中的编码区或剪接区、在体细胞中引起插入突变，以及促进拷贝数变异形成而导致或介导疾病。Alu 元件还可能通过影响非编码调控区而破坏表观遗传调控。由 Alu 相关基因功能破坏所致、表面上为散发性以及具有遗传性的遗传疾病，相关报告日益增多，但此前尚未有 Alu 元件插入导致马凡综合征的报道。我们报告了一个具有典型马凡综合征特征的家系，其既往 FBN1 遗传检测结果未能明确诊断。采用现代下一代测序及生物信息学分析，发现 FBN1 基因编码区存在一个致病性或破坏性 Alu 插入（c.6564_6565insAlu；p. Glu2189fs），并通过 Sanger 测序进一步确认及明确其具体情况。这确定了此前遗传检测技术未能发现的该家系疾病分子基础，并揭示了马凡综合征的一种新致病机制。本病例为 Alu 逆转座所致孟德尔遗传病日益增加的文献提供了补充，也显示出基因组技术检测非典型突变事件的能力正在不断提升。\n© 2023 Elsevier Masson SAS。"},"R-7BJUMXJE":{"title_zh":"尿道下裂患儿术后伤口感染的病原菌分布及血清的早期预测价值","abstract_zh":"本研究旨在探讨尿道下裂患儿的病原菌分布及血清的早期预测价值。研究样本为 2019 年 1 月至 2021 年 12 月第二附属医院收治的尿道下裂患儿。136 例患儿接受手术及一期尿道重建，并分为感染组（n = 18）和非感染组（n = 118）。多因素 logistic 回归分析显示，Snodgrass 术、阴茎下弯、阴囊发育不良、手术时间延长，以及术后 24 h 的 C 反应蛋白（CRP）、可溶性髓系细胞触发受体 1（sTREM-1）、可溶性细胞间黏附分子 1（sICAM-1）、白细胞（WBC）和中性粒细胞/淋巴细胞比值（NLR），是尿道下裂患儿术后伤口感染的危险因素（P \u003c 0.05）。ROC 曲线分析显示，术后 24 h 的 CRP、sTREM-1、sICAM-1、WBC 及 NLR 预测的 ROC-AUC 分别为 0.729、0.788、0.821、0.833、0.765 和 0.802。上述感染指标联合预测的 ROC-AUC 为 0.904。尿道下裂术后伤口感染主要为革兰阴性菌感染。Snodgrass 术、阴茎弯曲、阴囊发育不良、手术时间延长以及术后超过 24 h，可增加尿道下裂患儿伤口感染的风险。上述感染指标联合应用对预测伤口感染具有重要价值，临床护理中应更加关注具有上述危险因素的患儿。\n版权所有 © 2024 作者。"},"R-3DG7UXMM":{"title_zh":"中国尿道下裂患者尿道板离断预测列线图的开发与验证","abstract_zh":"目的\n开发并验证用于预测中国尿道下裂患者手术中尿道板（UP）离断的模型。\n方法\n回顾性分析复旦大学附属儿科医院 2019 年 1 月至 2022 年 12 月收治的 860 例初治尿道下裂患儿，以及上海交通大学医学院附属仁济医院 2021 年 1 月至 2023 年 6 月收治的 368 例初治尿道下裂患儿，并分为训练集和验证集。采用多因素 logistic 回归分析确定预测因素，在训练集中构建预测 UP 离断操作的列线图模型。使用曲线下面积（AUC）、校准曲线（CC）、决策曲线分析（DCA）及临床影响曲线（CIC）评价列线图模型的预测准确性和临床获益。\n结果\n多因素 logistic 回归分析显示，尿道口位置（MP）、阴茎弯曲（PC）、阴茎直径（PD）及尿道缺损长度/牵拉阴茎长度（UDR）是尿道下裂手术中 UP 离断的独立预测因素。列线图在训练集和验证集中的 AUC 分别为 0.810 和 0.791。列线图的 CC 接近理想对角线。此外，DCA 和 CIC 显示该模型的净获益显著更好。内部和外部验证组证实了该预测列线图的可靠性。\n结论\n本研究表明，MP、PC、PD 和 UDR 是中国尿道下裂患者手术中 UP 离断的显著预测因素。这可能有助于指导手术决策和治疗。\n© 作者 2026。"},"R-I8RS8FGD":{"title_zh":null,"abstract_zh":null},"R-FHSBSVUG":{"title_zh":"［口腔黏膜游离瓣移植在尿道下裂再次手术中的应用］","abstract_zh":"背景与目的\n颊黏膜移植物因其弹性、良好的贴附性、可获取较大面积及易于制备，广泛用于原发性尿道下裂和尿道狭窄的治疗。本研究旨在检验：对于合并较大尿道缺损且残余生殖器组织稀少的尿道下裂再次手术，颊黏膜瓣是否同样具有价值。\n方法\n选取 14 例年龄 3–11 岁（平均年龄 6.6 岁）的患者，于 1993 年 12 月至 1999 年 6 月接受手术。患者存在范围较大的瘘道，形状大致为椭圆形，最大直径为 7–42 mm（平均长度 18 mm）。原始手术方式为：Duplay 术（7 例）；颊黏膜移植物 Onlay 术（1 例）；Snodgrass 术（1 例）；包皮瓣管状成形术（2 例）；包皮移植物 Onlay 术（2 例）；膀胱黏膜瓣管状成形术（1 例）。从下唇获取黏膜瓣，以 Onlay 补片方式覆盖缺损，再以残余生殖器皮肤覆盖，并在条件允许时于两者间置入去上皮瓣。\n结果\n14 例中有 10 例获得理想的外观及功能结果，依据 Toguri 列线图，其尿流率 > 第 25 百分位数。3 例患者出现瘘：其中 1 例点状瘘自行愈合，另外 2 例经矫正手术后愈合。1 例患者出现尿道口回缩并伴轻度狭窄，经 MAGPI 术后解决。\n结论\n这些结果令人鼓舞。对于伴有较大尿道缺损的继发性尿道下裂，颊黏膜移植物也可能是一种有效的替代治疗选择。即使在第二阶段从唇部取材，供区也未报告发生并发症。"},"R-UJICLQQH":{"title_zh":"颊黏膜“Snodgraft”尿道下裂修复术：我们的经验","abstract_zh":"引言与目的：“Snodgraft”尿道下裂修复术是对 Snodgrass 推广的尿道板切开卷管（TIP）修复术的一种改良：在尿道板切口处植入移植物，而不是等待其自发再上皮化。当尿道板质量允许一期修复时，该技术是我们进行初次或再次尿道下裂修复的首选。本研究旨在评估“Snodgraft”技术用于初次或再次尿道下裂修复的结果。\n材料与方法：2003 年 1 月至 2010 年 1 月，我们为初治尿道下裂患者或多次修复失败的复杂尿道下裂患者施行了 88 例尿道成形术。其中 34 例采用分两期修复，54 例采用一期手术：28 例 Snodgraft 修复、3 例腹侧皮瓣修复，以及 23 例针对多次手术后狭窄和瘘的背侧或腹侧颊黏膜移植物（BMG）修复。上述 28 例中，15 例为初治尿道下裂，13 例为既往修复失败者（既往手术失败 1–4 次）。患者年龄为 3–34 岁。手术技术包括在尿道板和阴茎头背侧作切口，并以 BMG 行绗缝固定。从两侧游离尿道板，在腹侧缝合，并用肉膜瓣覆盖。\n结果：我们记录到 3 例阴茎头裂开（10.7%）、6 例小尿道瘘（21.4%）和 10 例冠状部皮肤坏死（35.7%）；所有这些并发症均在耻骨上膀胱造瘘置管 3–4 周后通过二次缝合得到解决。所有病例的功能结局均良好，患者排尿的峰值流量为 14–32 ml，且无残余尿。19 例外观结局良好，9 例令人满意。\n结论：在背侧尿道板切口处植入颊黏膜移植物，而不是等待自发再上皮化，可降低尿道愈合缺损的风险，从而减少尿道狭窄和瘘。“Snodgraft”是一种安全的一期手术，可在初治或既往修复失败的尿道下裂患者中获得可预期的良好功能及外观结果。"},"R-69VH3IXH":{"title_zh":"基于 FDA 不良事件报告系统（FAERS）的莫达非尼事件真实世界药物警戒研究","abstract_zh":"目的：本研究旨在基于 FAERS 数据库分析与莫达非尼相关的不良事件（AEs），为其安全性监测提供参考。\n方法：为量化莫达非尼相关 AE 的信号，采用不成比例分析，包括报告比值比（ROR）、比例报告比（PRR）、多项目伽马泊松缩减法（MGPS）和贝叶斯置信传播神经网络（BCPNN）算法等指标及方法。\n结果：我们从 FAERS 数据库提取了 2004 年第一季度至 2024 年第一季度的莫达非尼相关 AE 报告，并进行了详细的数据分析。在共计 21,035,995 份病例报告中，3070 份与莫达非尼直接相关。我们识别出用于描述这些 AE 的 127 个首选术语（PTs），涵盖 27 个器官系统。具体而言，应激性心肌病、脑水肿、肌张力低下、自然流产、早产、新生儿疾病和嗜酸性粒细胞性心肌炎等若干 AE 未在药品说明书中明确提及，提示可能存在新的药物不良反应（ADRs）信号。莫达非尼相关 AE 的中位发生时间为 76.5 天（四分位距［IQR］14–392 天），多数 AE 病例发生于开始使用莫达非尼后的第一个月。\n结论：对 FAERS 数据库的分析识别出与莫达非尼相关的 AE，尤其是与妊娠、产褥期及围产期状况相关的疾病，以及先天性、家族性和遗传性疾病及心脏疾病，而这些此前均未记载于该药物的官方说明书。这些发现强调，医疗专业人员需要持续开展上市后监测，并提高对潜在新 ADR 信号的警觉。\n© 2025 Elsevier B.V."},"R-CVEYJTJP":{"title_zh":"尿道下裂修复术的尿动力学评估。","abstract_zh":"目的：我们对接受尿道下裂修复术的人群开展了排尿情况的横断面评估，以确定患者在末次手术后不同随访时间点是否存在尿路梗阻。\n材料与方法：在 30 年间于本院科室接受尿道下裂修复术的约 600 名患者中，对其中 175 名年龄为 40 个月至 66 岁的患者进行了评估，由此建立了用于评估排尿功能的横断面研究组。所有患者均至少在 1 年前完成了尿道下裂的末次手术，且均已完成如厕训练。对初始尿道下裂的严重程度与手术技术一并进行评分。评估参数包括病史、体格检查，以及采用旋转圆盘式设备进行的尿流率测定。将尿流率测定数据（最大尿流率和排尿量）绘制在与年龄相关的列线图上，分为 4 个年龄组：小于 8 岁（28 名患者）、9–14 岁（18 名）、15–21 岁（39 名）及大于 21 岁（91 名）。所有尿流曲线图均由我们中的 2 人（J. F. A. v. d. W. 和 E. B.）评估。\n结果：患者初始疾病严重程度为 1 级者占 30%，2 级占 57%，3 级占 10%，4 级占 2%，不明者占 2%。113 名患者（65%）接受 van der Meulen 修复术，56 名（32%）接受 Byars-Denis Browne 联合修复术，6 名（3%）接受其他手术。根据尿流率列线图，随着年龄增长，最大尿流率正常的患者人数呈增加趋势。共 14 名患者的尿流曲线提示远端尿道梗阻，但均无症状。不同手术技术之间的尿流率特征无差异。\n结论：未能确定不同手术之间存在尿流率差异。随着随访时间延长，尿流率似乎有改善趋势。较低的最大尿流率与临床明显的梗阻之间无直接关系。"},"R-6UR3EFAA":{"title_zh":"AOP 报告：发育期雄激素信号传导受抑制导致尿道下裂的不良结局路径网络。","abstract_zh":"本报告概述了一个不良结局路径网络（AOPN），用于描述胎儿期雄激素信号传导减弱如何可能导致雄性后代发生尿道下裂。尿道下裂是生殖结节男性化受干扰所致的一种阴茎畸形。在正常生理条件下，雄激素作用促进雄性胎儿的生殖结节分化为阴茎。雄激素受体信号传导不足可损害生殖结节发育，导致人类和其他哺乳动物发生尿道下裂。在啮齿动物毒性研究中，包括依据经济合作与发展组织生殖毒性试验指南开展的研究，尿道下裂被作为一种不良结局进行评估。本报告介绍了三条不良结局路径（AOP-Wiki ID 为 477、570、571），各自具有代表抗雄激素机制的不同上游事件。在下游，这些路径汇聚于节点关键事件“雄激素受体激活降低”（1614），并具有共同的不良结局“尿道下裂”（2082）。本报告对全部三条不良结局路径（477、570、571）进行了评估，其中包括此前尚未报告的一个新关键事件（2082）和三个新关键事件关系（2828、3350、3488）。这三个将上游事件以非相邻方式与不良结局连接起来的关键事件关系，是采用系统的证据权重方法建立的。总体而言，支持这些不良结局路径的实验证据较强，例外或不确定性较少。该 AOPN 被认为适用于雄性哺乳动物，但支持数据主要来自啮齿动物和人类研究，因此其适用范围目前仅限于这些物种。尽管定量认识仍有限，该 AOPN 建立了抗雄激素活性与尿道下裂之间稳健的机制联系，为今后量化关键事件关系，以及基于通常在体外测定的上游事件开发预测方法奠定了基础。\n© 作者 2026。由牛津大学出版社代表环境毒理学与化学学会出版。本文为开放获取文章，依据知识共享署名许可协议（https://creativecommons.org/licenses/by/4.0/）发布；该协议允许以任何媒介进行不受限制的再使用、分发和复制，但须恰当引用原作。"},"R-P976VP3B":{"title_zh":null,"abstract_zh":null},"R-SQ5WXT8T":{"title_zh":"肛门生殖器距离作为前列腺癌诊断工具的研究","abstract_zh":"引言与目的：生殖器至肛门的距离（肛门生殖器距离［AGD］）反映哺乳动物产前发育期间的雄激素浓度。目前仅有一项研究提示 AGD 与前列腺癌（CaP）风险之间存在关系。本研究旨在更大人群中，评估作为产前雄激素环境生物标志物的 AGD 及 CaP 风险在 CaP 诊断中的表现和临床效用。\n材料与方法：对在一家医院门诊就诊的 260 名男性开展病例对照研究；这些男性接受了体格检查和男科检查，并填写了简短问卷。CaP 患者经肿瘤活检确诊。对照为在泌尿外科门诊接受常规检查且未患 CaP 的男性。测量两种 AGD：从肛门至阴囊后基底部的距离（AGDAs）和从肛门至阴茎头侧附着点的距离（AGDAP）。采用参数检验、非参数检验及受试者工作特征（COR）分析，确定 AGD 与是否存在 CaP 之间的关系。\n结果：在 Gleason = 7 亚组中，AGDAs 和 AGDAP 测量获得了最高的曲线下面积，分别为 0.69（95% cl：0.60–0.78）和 0.69（95% CI：0.61–0.77）；相应的敏感度和特异度分别为 83% 和 55%、91% 和 41%，阳性预测值分别为 39% 和 35%，阴性预测值分别为 90% 和 93%。\n结论：AGD 可能是 CaP 诊断的一种有用的临床工具。\n© 2018 西班牙男科学、性医学与生殖医学协会。由 Elsevier Espana, S.L.U. 出版。保留所有权利。"},"R-F2EKPSIT":{"title_zh":"孕期超声检测胎儿尿道下裂的效能：一项汇总分析。","abstract_zh":"背景：关于超声在产前诊断尿道下裂中的作用和价值，存在不同意见。虽然尿道下裂并非致死性畸形，但较严重的尿道下裂会对儿童生理和心理产生显著影响。另一方面，尿道下裂可能伴有其他畸形、综合征性疾病及胎儿生长受限（FGR）。本研究旨在系统评估超声在尿道下裂产前诊断中的价值。\n方法：在本系统综述和荟萃分析中，我们检索了截至 2024 年 6 月 30 日的 PubMed、Web of Science、Scopus、Embase 和中国知网（CNKI）数据库。关键词包括：尿道下裂、超声和产前诊断。根据合格标准对研究进行评估，并按照标准化方案提取纳入研究的数据。主要结局为超声检测胎儿尿道下裂的阳性预测值（PPV）、准确度、敏感度和特异度。采用诊断准确性研究质量评价工具 2（QUADAS-2）量表评估偏倚风险。使用自助法计算 PPV。当合并的研究数量不超过 5 项时，采用基于 Hartung-Knapp-Sidik-Jonkman（HKSJ）方法的随机效应模型作为荟萃分析策略，以评估总体效应。使用汇总受试者工作特征（SROC）曲线合并敏感度和特异度。研究方案已在 PROSPERO 注册（CRD42024586840）。\n研究发现：系统综述共纳入 9 项研究，涉及 600 例。纳入研究合并后的中位孕周为 27.64 ± 3.15 周。二维超声（2DUS）诊断胎儿尿道下裂和外生殖器畸形的总体 PPV 分别为 81%（95% 置信区间［CI］：77%–85%）和 88%（95% CI：86%–91%）。对其中 5 项研究进行深入分析后，2DUS 联合三维超声（3DUS）的准确度为 84%（95% CI：78%–89%），而单独使用 2DUS 的准确度为 74%（95% CI：69%–78%）。两种方法之间的差异为 10%。2DUS 联合 3DUS 诊断胎儿尿道下裂的合并敏感度为 86%（95% CI：79%–93%），特异度为 77%（95% CI：69%–86%），曲线下面积（AUC）为 0.86（95% CI：0.83–0.89）。\n解释：这是首项全面评估孕期超声检测胎儿尿道下裂的诊断性荟萃分析，提示超声在尿道下裂产前诊断中确实具有重要价值。仍需更多研究验证并完善现有研究发现，为未来临床实践提供更全面的指导。\n资助：本研究获重庆市科学技术委员会重庆市自然科学基金项目（CSTB2022NSCQ-MSX1001）及重庆医科大学未来医学青年创新计划（W0109）支持。\n版权 © 2025 作者。由 Elsevier Ltd. 出版。本文为依据 CC BY 许可协议（http://creativecommons.org/licenses/by/4.0/）发布的开放获取文章。"},"R-FSDKFFWT":{"title_zh":"美国先天性畸形出生患病率的种族／族裔差异","abstract_zh":"目的：本研究旨在分析一个大型、具有代表性的人群，以确定先天性畸形（CA）患病率的种族／族裔差异。\n设计：本研究是一项基于人群的综合分析，考察 CA 诊断患病率的种族／族裔差异。我们回顾了 2008 年全美住院患者抽样数据库（NIS）中的全部活产儿，并确定高加索裔人群中选定的 55 类 CA 诊断的出生患病率。随后计算非裔美国人、西班牙裔及亚裔相对于高加索裔人群发生这些 CA 诊断的相对风险。\n结果：在包含 1,048,252 名活产儿的队列中，CA 的总体患病率为每 1000 名活产儿 29.2 例，其中 51% 为高加索裔。与高加索裔相比，非裔美国人（RR = 0.9，CI：0.8–0.9）和西班牙裔（RR = 0.9，CI：0.8–0.9）的总体 CA 风险较低。高加索裔和亚裔的总体 CA 风险相似。相对于高加索裔，非裔美国人的心脏、泌尿生殖系统及颅面部 CA 风险较低，但肌肉骨骼畸形风险较高。西班牙裔的泌尿生殖系统和胃肠道 CA 风险较低。亚裔的颅面部及肌肉骨骼 CA 风险较高。\n结论：观察到的 CA 风险种族／族裔差异，可能与遗传易感性、可改变暴露的文化或社会差异，或易感性与暴露之间多种潜在组合有关。\n© 2015 Walter de Gruyter GmbH。保留所有权利。"},"R-NCU4PI4P":{"title_zh":"采用尿流率测定对尿道口旁包皮瓣一期尿道成形术修复尿道下裂进行功能评估。","abstract_zh":"背景：尿流率测定是一项简单、准确且无创的检查。在本研究中，我们旨在确定尿流率测定在评估尿道口旁包皮瓣一期尿道成形术（OUPF）功能结果中的作用。\n方法：选取在本院接受 OUPF 修复术的 21 名儿童。选择标准为患者已完成如厕训练且无瘘。采用旋转圆盘传感器进行尿流率测定。将最大尿流率（Q(max)）和平均尿流率（Q(ave)）绘制在与体表面积相关的尿流率列线图上。使用正常人群第 5、10、15、20 和 25 百分位数的 95% 容许上限进行比较。将尿流形态分为钟形、平台型或间断型。\n结果：首次尿流率测定时的中位年龄为 4.7 岁（范围 2.5–8.6 岁），术后平均随访时间为 25 个月（范围 1–58 个月）。12 名儿童的 Q(max) 高于正常人群第 25 百分位数，6 名介于第 5 与第 25 百分位数之间，3 名低于第 5 百分位数。17 名儿童（80.6%）获得了正常钟形尿流曲线。在 Q(max) 低于第 5 百分位数的 3 名儿童中，2 名呈平台型尿流形态，并被发现存在尿道狭窄。成功施行扩张后，Q(max) 恢复至正常范围，症状消失。\n结论：OUPF 技术用于尿道下裂修复可获得令人满意的功能结果。我们主张在术后常规随访中使用尿流率测定。"},"R-NND62XTU":{"title_zh":"小儿泌尿外科：全基因组关联研究（GWAS）发现尿道下裂相关位点。","abstract_zh":"在发达国家中，俄罗斯持续居高不下的心血管病死亡率构成了一个特殊情况。应用心血管风险预测模型在该国的一级预防中具有巨大潜力。本研究利用来自莫斯科和圣彼得堡的一组独特队列随访数据，旨在检验并重新校准用于预测普通人群心血管病（CVD）死亡风险的系统性冠状动脉风险评估（SCORE）方法。研究基于覆盖 1975–2001 年的汇总流行病学队列数据。采用 SCORE 项目的算法，针对莫斯科和圣彼得堡人群校准 SCORE 方程（SCORE-MoSP）。根据原始 SCORE-High 和 SCORE-Low 方程估计不同年龄的 10 年累积心血管病死亡率，并与重新校准后的 SCORE-MoSP 模型估计值及观察到的 CVD 死亡率进行比较。分别采用常规 SCORE-High 和重新校准后的 SCORE-MoSP 方法生成 CVD 死亡的 10 年风险预测图，并进行比较。原始 SCORE-High 模型往往显著低估女性的 10 年心血管病死亡风险。SCORE-MoSP 模型提供了更好的结果，更接近观察值。对于男性，SCORE-High 和 SCORE-MoSP 的估计值相似，均倾向于低估较年轻年龄段的 CVD 死亡风险。这些差异也反映在风险预测图中。在俄罗斯使用未经校准的评分模型，可能导致某些人群的心血管病死亡风险被显著低估。尽管 SCORE-MoSP 对女性提供了更好的结果，但仍需要纳入更广泛风险因素的更复杂评分方法。"},"R-H2TV8YL6":{"title_zh":"基于青春期前肛生殖距离、阴茎阴囊距离及 2D:4D 指长比预测尿道下裂分型的机器学习模型的开发与验证","abstract_zh":"目的：利用目前常用的人体测量指标数据描述青春期前尿道下裂的解剖异常，并预测术后诊断分型。\n方法：选取 2021 年 4 月至 2022 年 9 月在四川省人民医院初次接受治疗的青春期前尿道下裂患儿。记录其术前阴茎阴囊距离、肛生殖距离、2D:4D 指长比及术后尿道下裂分型。在训练集中，采用受试者工作特征曲线对各指标预测尿道下裂分型的诊断价值进行单因素分析。构建二分类 Logistic 回归、随机森林及支持向量机模型。此外，前瞻性收集 2022 年 10 月至 2023 年 9 月的数据作为测试集，以验证所构建的机器学习模型。\n结果：本研究纳入 389 例，其中远端型 50 例、阴茎中段型 167 例、近端型 172 例。在验证集中，二分类 LR、RF 和 SVM 模型识别远端型的敏感度分别为 17%、17% 和 0%，识别阴茎中段型的敏感度分别为 61%、55% 和 64%，识别近端型的敏感度分别为 56%、60% 和 48%。三分类 RF 和 SVM 模型对远端型的敏感度分别为 17% 和 17%，对阴茎中段型分别为 64% 和 73%，对近端型分别为 60% 和 60%。在测试集中，
