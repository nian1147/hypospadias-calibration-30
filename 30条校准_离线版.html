二分类 LR、RF 和 SVM 模型识别远端型的敏感度分别为 6%、0% 和 0%，识别阴茎中段型的敏感度分别为 64%、55% 和 66%，识别近端型的敏感度分别为 48%、62% 和 39%。三分类 RF 和 SVM 模型对远端型的敏感度分别为 12% 和 0%，对阴茎中段型分别为 57% 和 77%，对近端型分别为 65% 和 53%。与二分类模型相比，三分类模型对远端型的敏感度未得到改善。\n结论：肛生殖距离和阴茎阴囊距离对阴茎中段型及近端型尿道下裂具有良好的预测价值，其中 AGD2 的检验效能和稳定性较高，建议作为首选肛生殖距离指标。2D:4D 指长比（RadioL、RadioR）对尿道下裂分型的预测价值较低。\n2024 He、Yang、Tang 和 Wang。"},"R-48H94TIH":{"title_zh":null,"abstract_zh":null},"R-DGSI45KZ":{"title_zh":"RENAC：阿根廷国家先天异常登记系统","abstract_zh":"引言：国家先天异常登记系统（Registro Nacional de Anomalías Congénitas，RENAC）是一个以医院为基础、针对具有重大形态性先天异常（CAs）新生儿的监测系统。本研究旨在描述 RENAC 登记系统的特征与运行情况，以及所选 56 种特定 CAs 的出生患病率，并与其他登记系统比较。\n研究人群与方法：RENAC 登记系统最初在年分娩量达到或超过 1000 例的公立医院，或在特定卫生区域内承担转诊任务的医院开展组织工作。新生儿科医生负责数据收集，中央协调部门负责编码、统计分析及定期报告。RENAC 登记系统通过在线论坛提交数据，并就病例的初始处理提供指导与互动。\n结果：2009 年 11 月 1 日至 2012 年 6 月 30 日期间，共有 98 家医院纳入登记系统；这些医院每年的分娩量覆盖公立部门的 65%，以及阿根廷全部出生人口的 35%。在此期间，共检查 294 005 名新生儿，发现 5165 例重大 CAs（1.76%；95% CI：1.71–1.80）。最常见的 CAs 为心脏间隔缺损（每 10 000 名新生儿患病率为 28.6）、唐氏综合征（每 10 000 名新生儿患病率为 19.2）、唇裂伴或不伴腭裂（每 10 000 名新生儿患病率为 12），以及一组神经管缺陷（每 10 000 名新生儿患病率为 11.9）。\n结论：RENAC 已在公立部门实现较高覆盖率，其患病率与其他登记系统之间的差异，视具体情况而定，可能与运行方面的因素有关，也可能反映真实差异。RENAC 负责收集、分析和传播阿根廷 CAs 的相关信息，也为地方干预措施作出贡献。"},"R-DLEWQU5Z":{"title_zh":"通过体外功能研究分析 NR5A1/SF1 突变的基因型与表型关系","abstract_zh":"背景：类固醇生成因子 1（SF1、NR5A1）是参与性腺及肾上腺发育和类固醇生成的关键因子之一。迄今已在 XY 性发育障碍（DSD）的不同表型中报道超过 50 种突变，这些表型包括完全性性腺发育不全、重度和轻度部分性性腺发育不全、尿道下裂、不育及双侧无睾症。目前尚未证实基因型与表型之间的相关性。\n目的与假设：通过体外功能研究，考察 SFl 突变的基因型与表型相关性。\n方法：在统一的实验设置下，使用 HEK 细胞和支持细胞中的 Dual-Glo 荧光素酶检测，考察不同 SF1 错义突变对性腺发育关键启动子的转录活性。选取来自表型范围从不育到完全性性腺发育不全患者、位于不同结构区域的突变。以睾丸决定启动因子 TESCO、反映类固醇生成及 Leydig 细胞功能的 CYP11A1 启动子，以及代表支持细胞功能的 AMH 作为报告系统。\n结果：位于 DNA 结合域（p.E35G、p.R62C）及配体结合域（p.L376F）、导致部分性和完全性性腺发育不全的 SF1 错义突变，其激活 TESCO 和 CYP11A1 启动子的能力显著降低。位于铰链区（p.P131L、p.P191C）、导致不育的 SF1 突变，仅表现出激活 TESCO 的能力中度降低，以及对 CYP11A1 启动子的激活轻度降低。所有突变均未表现出 AMH 启动子转录活性的显著降低。\n结论：不同 SF1 突变对 TESCO 和 CYP11A1 启动子的转录活性，在体外反映了性腺发育不全临床表现的严重程度及类固醇生成功能。利用 TESCO 和 CYP11A1 启动子开展 SF1 突变功能研究，可作为有助于预测表型的体外模型。"},"R-4X2GGR7K":{"title_zh":"Circapproved：通过人工神经网络进行数字模式识别，利用移动应用识别用于判定包皮环切术适宜性的正常阴茎参数","abstract_zh":"背景：包皮环切术是一种因医疗、文化及宗教原因而广泛开展的外科手术，需要全面评估阴茎解剖结构以确定是否适宜手术，尤其需要识别先天异常等禁忌证。本研究致力于开发一种基于人工智能（AI）的数字模式识别系统，通过移动应用准确识别用于判定包皮环切术适宜性的正常阴茎参数。\n方法：采用人工神经网络（ANN），利用家长或医务人员拍摄的阴茎背侧、外侧及腹侧数字图像训练 AI 模型。训练采用图像增强、迁移学习等先进技术，以克服数据集有限所带来的挑战。严格遵守伦理准则，并取得所有参与者的知情同意，确保研究符合《赫尔辛基宣言》。\n结果：整合到 Circapproved 移动应用中的 AI 模型，在正常和异常阴茎状况的分类中表现出较高准确率，背侧视图的准确率达到 88.89%，外侧视图为 90.91%，腹侧视图为 92.5%。开发流程包括数据预处理、数据划分及增强，AI 模型部署于云平台，以确保可扩展性和可访问性。结果表明，该 AI 驱动的移动应用在促进大规模筛查及简化包皮环切术批准流程方面具有显著潜力，尤其适用于资源有限的环境。\n结论：该方法凸显了整合 AI 以提高包皮环切术批准流程精确性的潜力。未来研究应着重进一步扩充数据集，以提高模型准确率。\n(c) 2025 Elsevier Inc. 保留所有权利，包括文本与数据挖掘、AI 训练及类似技术相关权利。"},"R-Q8ND3NB7":{"title_zh":"利用神经网络非线性建模预测尿道下裂的基因型与表型相关性","abstract_zh":"引言\n尿道下裂是尿道、腹侧皮肤及阴茎海绵体的发育异常。尿道外口位置和腹侧弯曲历来是界定临床严重程度的标志。基因分型从未被作为临床预测因素加以探索。已有报告证实，基因突变与手术结局不良的综合征性尿道下裂之间存在相关性。我们假设，纳入基因分型有助于对所有类型的尿道下裂进行分类。我们介绍使用神经网络算法评估表型／基因型相关性，并提出其潜在的临床适用性。\n方法\n对 1974 年 1 月至 2022 年 6 月期间的文献进行系统综述。文献检索自 Medline、Embase、Web of Science 和 Google Scholar。纳入的文献须明确描述尿道下裂表型的解剖特征（按照解剖描述确定的尿道外口位置），并明确描述基因型（基因突变）。排除存在一种以上变异／突变的病例。使用 SPSS™ 神经网络非线性数据建模，对表型与基因型进行综合统计分析。\n结果\n对 1731 名研究对象进行基因型与表型分析。其中，远端型 959 名（55%），近端型 772 名（45%）。共识别出 49 个存在突变的基因。神经网络聚类对冠状沟型（90%）和龟头型（80%）的预测较好，对阴茎中段型（22%）和会阴型（45%）的预测最差。仅以基因作为预测因素时，该模型能够以较高水平和更高准确度预测冠状沟型及龟头型尿道下裂的表型。以下基因型与特定表型存在关联：AR 基因 n.2058G > A 与龟头型相关（p\u003c0.0001），n.480C > T 与冠状沟型相关（p = 0.034），R840C 与会阴型相关（p = 0.002）；MAMLD1 基因 c.2960C > T 与冠状沟型相关（p\u003c0.0001），p. G289S 与龟头型相关（p\u003c0.0001）；SRD5A2 基因 607G > A 与阴囊型相关（p\u003c0.0001），c16C > T 与阴茎阴囊型相关（p\u003c0.0001），c59 T > c 与会阴型相关（p = 0.042），V89L 与阴茎中段型及阴囊型相关（分别为 p\u003c0.0001、p = 0.041）。\n讨论\n尿道下裂表型一直仅从解剖学角度进行描述。我们的结果表明，目前的表型分型与基因型相关性较差。远端型尿道下裂较高的基因型／表型相关性，证明了对这些病例进行基因分型的临床适用性。鉴于远端型尿道下裂所报告的较高阳性检出率，有必要重新考虑性发育差异的概念及分类。考虑到基因分型在与表型关联方面具有更好的预测价值，今后的工作应着眼于利用基因型。\n结论\n尿道下裂的表型／基因型相关性较差。若与其他预测变量结合使用，对所有尿道下裂表型进行测序可能具有额外临床价值。神经网络分析可能有能力将所有这些变量结合起来用于临床预测。\n[图形]\n。"},"R-JRETW88Y":{"title_zh":null,"abstract_zh":null},"R-I5628FAW":{"title_zh":"儿童轻度尿道下裂术后性激素与小阴茎的相关性分析","abstract_zh":"目的：分析儿童轻度尿道下裂术后性激素水平与小阴茎的相关性。\n方法：开展病例对照研究。分析 2022 年 4 月至 2024 年 4 月在新乡医学院第一附属医院接受轻度尿道下裂手术的 71 例 1～13 岁患儿的临床资料。术前根据阴茎牵伸长度（SPL），将患儿分为轻度尿道下裂组（A 组）和轻度尿道下裂合并小阴茎组（B 组）。测定两组的泌乳素、促卵泡激素（FSH）、黄体生成素（LH）、孕酮及睾酮（TES）水平。采用多因素 Logistic 回归分析构建风险预测模型。采用受试者工作特征（ROC）曲线评估模型的区分能力。术后 6 个月再次测量 SPL 和性激素水平。根据 SPL，将轻度尿道下裂术后患儿分为阴茎正常组（AA 组）和小阴茎组（BB 组）。采用多因素 Logistic 回归分析构建风险预测模型，并通过 ROC 曲线进行评价。\n结果：术前 A 组 FSH、LH 和 TES 水平分别为 3.28（2.02，4.46）IU/L、0.53（0.25，0.79）IU/L 和 25.24（17.94，36.67）ng/dL，B 组分别为 1.42（1.10，1.84）IU/L、0.14（0.09，0.23）IU/L 和 15.73（12.92，17.00）ng/dL，差异均有统计学意义（均 P\u003c0.05）。多因素 Logistic 回归分析显示结果具有统计学意义（OR=0.515，95% CI：0.271–0.977；OR=0.035，95% CI：0.002–0.542；OR=0.883，95% CI：0.796–0.980）。预测模型的 ROC 曲线下面积（AUC）为 0.906，敏感度为 75.00%，特异度为 95.74%。术后 AA 组 FSH、LH 和 TES 水平分别为 2.97（1.88，4.28）IU/L、0.46（0.23，0.78）IU/L 和 20.92（17.34，33.27）ng/dL。BB 组 FSH、LH 和 TES 的中位水平分别为 1.52（1.27，1.82）IU/L、0.17（0.12，0.26）IU/L 和 15.08（11.68，16.68）ng/dL，差异均有统计学意义（均 P\u003c0.05）。多因素 Logistic 回归分析显示结果具有统计学意义（OR=0.484，95% CI：0.236–0.992；OR=0.061，95% CI：0.004–0.939；OR=0.891，95% CI：0.795–0.999）。所构建预测模型的 AUC 为 0.877，敏感度为 94.12%，特异度为 68.52%。\n结论：较低的 FSH、LH 和 TES 水平是轻度尿道下裂术后小阴茎的危险因素，且术前激素水平具有更高的预测价值。\n© 2025 中华医学会。"},"R-BH9VMRBY":{"title_zh":"宫内联合暴露于 AR 拮抗剂与胎儿睾酮合成抑制剂对 F1 代雄性大鼠产生累积效应","abstract_zh":"风险评估通常逐一针对单种化学物质开展；然而，许多监管机构正在制定用于评估化学物质混合物累积风险的框架。本研究考察了在妊娠第 14～18 天经口联合给予通过两种不同机制干扰大鼠性分化的化学物质时，这些化学物质如何干扰 F1 代雄性大鼠的生殖发育。实验 1 使用 50. mg/kg-d 腐霉利与 500. mg/kg-d 邻苯二甲酸二丁酯（DBP）的混合物，而实验 2 使用 150. mg/kg-d 腐霉利与 1125. mg/kg-d DBP（最高剂量），或最高剂量的 0、4.17%、8.33%、16.7%、33.3%、50%、66.7% 和 83.3%。将剂量相加与反应相加的预测结果和观察到的效应进行比较后发现，剂量相加模型比反应相加模型更准确，表明通过不同毒性机制起作用的化合物可产生累积的剂量相加效应。\n© 2010。"},"R-4VHYT4J3":{"title_zh":"1442 名法国男性新生儿人群中生殖器畸形的产前环境危险因素：一项巢式病例对照研究","abstract_zh":"背景：过去几十年中，隐睾和尿道下裂等男性外生殖器畸形呈上升趋势，由此引发了环境化学物质可能损害男性胎儿性发育的怀疑。多种环境污染物，包括有机氯农药、多氯联苯、双酚 A、邻苯二甲酸酯、二噁英及呋喃，具有雌激素样活性及抗雄激素活性，因此被视为内分泌干扰化学物质（EDCs）。由于男性性分化高度依赖于胎儿期雄激素的正常产生及作用，EDCs 可能改变正常的男性性分化。\n目的：本研究旨在确定法国南部足月男性新生儿人群外生殖器畸形的发生率。我们还开展了一项病例对照研究，以识别男性外生殖器畸形的危险因素，重点关注父母职业性 EDCs 暴露。\n方法：在 16 个月内，一家一级产科病房登记了 1615 名出生体重超过 2500 g 的足月男性新生儿，同一名儿科医生对其中 1442 名（89%）进行了隐睾、尿道下裂及小阴茎的系统检查。针对每名存在生殖器畸形的男性新生儿，纳入近两名在年龄、产次及胎龄方面匹配的男性新生儿。通过详细问卷，就妊娠相关情况、个人特征、生活方式及职业性 EDCs 暴露，对所有病例及对照新生儿的父母进行访谈。\n结果：共报告 39 例生殖器畸形（2.70%），其中隐睾 18 例（1.25%）、尿道下裂 14 例（0.97%）、小阴茎 5 例（0.35%），以及 46,XY 性分化障碍（DSD）2 例（0.14%）。新生儿隐睾、尿道下裂或小阴茎与父母职业性农药暴露之间存在显著关联［比值比（OR）=4.41；95% 置信区间（95% CI）：1.21–16.00］。男性外生殖器畸形的家族聚集（OR=7.25；95% CI：0.70–74.30）及母亲妊娠期用药（OR=5.87；95% CI：0.93–37.00）与隐睾、尿道下裂及小阴茎风险有关，但关联无统计学意义。\n结论：尽管男性生殖器畸形的病因涉及多种因素，我们的数据支持以下假设：产前农药污染可能是男性新生儿外生殖器畸形的潜在危险因素，因此应在所有男性化不足的男性新生儿中常规调查该因素。"}},"digest":"2f80833c2884fa84099229d1c08ebb4d6dff9815df8b22a8ceb9c5b4d81886d5","icons":{"overview":"\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>\u003c/svg>","screen":"\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H3V5a1 1 0 0 1 1-1Zm16 0h-4a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h4V5a1 1 0 0 0-1-1Z\"/>\u003c/svg>","export":"\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5\"/>\u003c/svg>","compare":"\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"5\" width=\"7\" height=\"15\" rx=\"1\"/>\u003crect x=\"14\" y=\"5\" width=\"7\" height=\"15\" rx=\"1\"/>\u003cpath d=\"M6 9h1m10 0h1M6 13h1m10 0h1\"/>\u003c/svg>","rules":"\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M6 3h12v18H6zM9 7h6M9 11h6M9 15h4\"/>\u003c/svg>","save":"\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 3h14l3 3v15H3V3zM7 3v6h10V3M7 21v-8h10v8\"/>\u003c/svg>","check":"\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L20 5\"/>\u003cpath d=\"M20 13v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10\"/>\u003c/svg>","clock":"\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 7v5l3 2\"/>\u003c/svg>","restore":"\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M3 10a9 9 0 1 1 2 8M3 4v6h6M12 7v5l3 2\"/>\u003c/svg>"}}</script>
<script type="module">
const SCHEMA = 'hypospadias-calibration30/v1';
const BATCH = 'calibration30_native_2026-10-08';
const RULES = 'v4_calibration_B1_2026-11-21';
const LABELS = {include:'纳入',exclude:'排除',unsure:'不确定',escalate:'待导师裁决'};
const ROLES = ['A','B'];
function chinaDate(now = new Date()) {
  return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
}
function validDate(value, today=chinaDate()) {
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const d = new Date(value+'T00:00:00Z');
  return !Number.isNaN(d.getTime()) && d.toISOString().slice(0,10)===value && value>='2000-01-01' && value<=today;

function validateVote(v, role, today=chinaDate()) {

function exportsView(){
 return heading('RESULTS & BACKUPS','让每一条判断，都能带走。',`当前为研究者 ${state.role} 的本机记录：${countVotes(state)}/30 条已提交，${Object.keys(state.drafts).length} 条草稿。`)+
 `<div class="export-grid"><section class="card export-card"><span class="export-icon">${icons.export}</span><h2>个人结果 · Excel CSV</h2><p>包含固定30条中英文题录、已提交判断、理由、研究者、实际日期和用时。未提交的判断列保持空白，草稿不冒充完成。</p><button class="primary" data-action="export-csv">导出我的CSV</button></section><section class="card export-card"><span class="export-icon">${icons.save}</span><h2>完整备份 · JSON</h2><p>保存本机原票、草稿及修改历史，便于恢复进度。双方完成后，可将这份文件交给搭档做结果比对。</p><button class="primary" data-action="export-json">下载JSON备份</button></section><section class="card export-card"><span class="export-icon">${icons.restore}</span><h2>换设备，恢复我的进度</h2><p>导入你本人从本站导出的JSON。会核对批次、题录指纹和规则版本，并先备份当前记录。不同网址或离线版的进度需要用JSON转移。</p><button class="secondary" data-action="restore">恢复个人备份</button></section><section class="card export-card"><span class="export-icon">${icons.screen}</span><h2>一份可以离线打开的工作台</h2><p>题录、译文和界面已打包成一个HTML文件。下载后直接用浏览器打开，填写过程不依赖在线服务。</p><a class="secondary" href="./30条校准_离线版.html" download>下载独立离线版</a></section></div>
 <div class="notice"><strong>交回结果：</strong>双方各自完成后，导出CSV和JSON，通过你们原有的沟通渠道交回。本网站不会自动把答案同步给对方；清理浏览器数据可能清除本机记录，请保留下载的备份。</div><section class="card space-top"><div class="card-body"><h3>原始判断不会被共识覆盖</h3><p class="section-desc">当前保留 ${state.audit.length} 条操作历史。重新提交判断和修改共识会追加历史；完整记录在JSON备份中。本站不导入主工作台的既有票，也不回写主工作台进度。</p><dl class="info-list"><dt>题录批次</dt><dd class="mono">${BATCH}</dd><dt>规则版本</dt><dd class="mono">${RULES}</dd><dt>题录指纹 · SHA-256</dt><dd class="mono">${e(digest)}</dd></dl></div></section>`;
}
function abVotes(id){return state.role==='A'?[state.votes[id],state.partner.state.votes[id]]:[state.partner.state.votes[id],state.votes[id]];}
function comparison(){
 const n=countVotes(state);
 let html=heading('COMPARE & DISCUSS','先保留原票，再讨论共识。','双方各自完成30条后，才导入对方结果。共识另存，保留双方原始判断。');
 if(!state.partner){return html+`<section class="card empty-state"><span class="empty-icon">${icons.compare}</span><h2>${n===30?'你的30条已完成，等待搭档结果。':'独立校准，还在进行中。'}</h2><p>你已提交 ${n}/30 条。完成后交换各自的JSON备份；只有你的记录和搭档文件都完成30条，才能打开双人比对。</p><div class="actions"><button class="primary" data-action="partner" ${n<30?'disabled':''}>导入搭档JSON</button><button class="secondary" data-action="${n===30?'export-json':'resume'}">${n===30?'下载我的JSON':'继续独立筛选'}</button></div><div class="notice">公共网址只展示题录和规则。每人的答案保存在自己的设备；请在独立完成之前保管好自己的结果文件。</div></section>`;}
 const different=records.filter(r=>{const [a,b]=abVotes(r.record_id);return a.choice!==b.choice;}),stats=agreementStats(records,state);
 html+=`<div class="card"><div class="card-body"><h2>双方均已完成30条</h2><p class="section-desc">原始判断一致 ${stats.agreement} 条，分歧 ${different.length} 条；一致率 ${(stats.observed*100).toFixed(1)}%；三分类未加权 Cohen κ：${stats.kappa===null?'不可估计（期望一致率为1）':stats.kappa.toFixed(3)}。</p><div class="table-scroll"><table class="agreement-table"><caption>双方原票交叉表 · 行为 A，列为 B</caption><thead><tr><th scope="col">A / B</th>${stats.choices.map(c=>`<th scope="col">${LABELS[c]}</th>`).join('')}</tr></thead><tbody>${stats.matrix.map((row,i)=>`<tr><th scope="row">${LABELS[stats.choices[i]]}</th>${row.map(n=>`<td>${n}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted">“不确定”作为独立类别。结果只描述这组校准样本；不用一致率或κ阈值替代关键边界的解决。</p><div class="notice info">搭档记录来自一次文件快照。对方修改后，请重新导入新JSON；不会自动同步。</div></div></div><div class="comparison-summary"><label class="check-line"><input type="checkbox" id="only-differences" ${onlyDifferences?'checked':''}>只看原票分歧</label><div class="actions"><button class="secondary" data-action="partner">更新搭档结果</button><button class="secondary" data-action="export-stats">导出一致性统计</button><button class="primary" data-action="export-comparison">导出比对与共识CSV</button></div></div>`;
 const rows=onlyDifferences?different:records;
 if(!rows.length)html+='<section class="card empty-state"><h2>双方原票一致。</h2><p>仍可取消“只看原票分歧”，逐条核对理由；一致不等于标准已经经过外部验证。</p></section>';
 return html+rows.map(r=>{const [a,b]=abVotes(r.record_id),c=state.consensus[r.record_id],stale=c&&c.basis!==voteBasis(a,b);return `<section class="card compare-card"><div class="compare-title"><span class="tag ${a.choice===b.choice?'include':'pending'}">${a.choice===b.choice?'一致':'有分歧'}</span><span class="muted small"> 第 ${ids.indexOf(r.record_id)+1} 条 · ${e(r.record_id)}</span><h3>${e(translations[r.record_id]?.title_zh||r.title)}</h3><p class="small muted">${e(r.title)}</p></div><div class="compare-votes">${[['A',a],['B',b]].map(([role,v])=>`<div class="compare-vote"><p class="small muted">研究者 ${role} · ${e(v.reviewer)} · ${e(v.date)}</p>${label(v)}<p>${e(v.reason||'未填写附加理由。')}</p></div>`).join('')}</div><form class="consensus-form" data-consensus="${e(r.record_id)}"><div class="field-row"><label class="field">讨论后共识<select name="choice" required><option value="">请选择</option>${Object.entries(LABELS).map(([value,title])=>`<option value="${value}" ${c?.choice===value?'selected':''}>${title}</option>`).join('')}</select></label><label class="field">讨论依据 · 必填<textarea name="reason" maxlength="4000" required placeholder="双方核实了什么，为什么达成此决定？">${e(c?.reason||'')}</textarea></label></div><div class="consensus-meta"><span class="small ${stale?'form-error':'muted'}">${stale?'原票已更新，请复核原有共识。':c?`共识由 ${e(c.reviewer)} 于 ${e(c.date)} 保存。`:'共识未填写；不会自动复制任何一方的原票。'}</span><button class="secondary" type="submit">保存本条共识</button></div></form></section>`;}).join('');
}
function rulesView(){return heading('SCREENING PROTOCOL','先核对问题，再作出判断。','只读题名与摘要。这轮“纳入”表示进入全文候选。')+`<div class="rules-layout"><section class="card"><div class="card-head"><h2>本轮执行标准 · B1更新</h2><span class="tag">2026-11-21</span></div><div class="card-body"><div class="rule"><h3>研究人群：接受尿道下裂修复的儿科患者</h3><p>本轮按2026-11-21作者采纳的B1工作定义执行：手术或模型预测起点未满18岁。成人专门研究排除。混合年龄研究仅在儿科模型/数据可分离并报告儿科独立性能时最终纳入；全队列性能不作为儿科证据。题名摘要无法确认时选“不确定”，进入全文核实。年龄不明者若正文仍无法确认，则不纳入，并保留记录。儿童术后成年随访按预测起点判断，同时核查结局时限，不因成年随访直接排除。</p></div><div class="rule"><h3>年龄边界速查</h3><p>仅报均龄、只写“儿童”而无数字：先选“不确定”，查全文年龄范围。年龄12–19岁或上限18–21岁：核对&lt;18岁模型/数据能否分离，不能按均龄或多数为儿童直接纳入；能分离则进入候选，摘要判不清则“不确定”待全文。儿童手术、成年随访：可进入候选，继续核对预测起点与结局时限。</p></div><div class="rule"><h3>预测模型：开发或验证多变量个体预测模型</h3><p>模型可为回归方程、列线图、风险评分或机器学习。只报告危险因素的OR、HR或P值，不自动构成预测模型；出现“评分”或“列线图”也需要核实实际用途。</p></div><div class="rule"><h3>预测目标：修复后的术后结局</h3><p>包括术后并发症及其他预设术后结局。出生风险、诊断、解剖分类、单纯测量、术中是否离断尿道板的决策预测及并发症报告分级工具，不符合本问题。</p></div><div class="rule"><h3>题名摘要阶段：保守保留，全文核实</h3><p>摘要未报告AUC不能据此排除。全文阶段再确认至少一项区分度或校准性能。摘要为空或信息不足时选“不确定”，注明需要核查什么。最终纳入语言为中英文。</p></div><div class="rule"><h3>研究类型与协作</h3><p>综述、社论、会议摘要、病例报告、动物或基础研究按现行标准排除。双方独立判断，不交换答案，不展示AI建议或AI排序。讨论后共识单列，无法解决的资格分歧记录为“待导师裁决”。</p></div></div></section><aside><section class="card"><div class="card-head"><h2>填写时记住</h2></div><div class="card-body"><ul class="steps"><li><div><strong>纳入</strong><p>进入全文候选，尚未最终纳入综述。</p></div></li><li><div><strong>排除</strong><p>填写具体不符条款与依据。</p></div></li><li><div><strong>不确定</strong><p>写明信息缺口，留待核实。</p></div></li></ul></div></section><div class="notice">B1为作者已采纳的本轮工作定义，搭档确认和条款定稿另行记录。原注册为任何年龄，本地执行修订不等于OSF已在线修改。受本次规则变化影响的既有票需另记复核。</div><section class="card space-top"><div class="card-body"><dl class="info-list"><dt>样本来源</dt><dd>2026-10-08 八库原检索、Zotero原生去重后的同一组30条；顺序与原A/B校准CSV一致。</dd><dt>原始题录版本</dt><dd class="mono">v1_八库原检索_原生去重_2026-10-08</dd><dt>使用边界</dt><dd>本轮只做30条校准，不计作555条批次或全量题录的筛选完成。</dd></dl></div></section></aside></div>`;}
function render(){
 updateNav();$('#main').innerHTML=({overview,screening,exports:exportsView,comparison,rules:rulesView}[view])();
 const name=$('#reviewer-name');if(name)name.addEventListener('input',()=>{state.reviewer=name.value.trim();persist();});
 const role=$('#reviewer-role');if(role)role.addEventListener('change',()=>{persist();state=loadState(role.value);activeRole=state.role;selected=state.last_id||ids.find(id=>!state.votes[id])||ids[0];persist();render();});
 const q=$('#record-search');if(q)q.addEventListener('input',()=>{search=q.value;$('#records').innerHTML=listMarkup();$('#list-count').textContent='显示 '+visibleRecords().length+' 条 · 原始顺序';});
 const f=$('#vote-form');if(f){f.addEventListener('input',saveDraft);f.addEventListener('submit',ev=>{ev.preventDefault();submitVote(true);});}
 $('#only-differences')?.addEventListener('change',ev=>{onlyDifferences=ev.target.checked;render();});
 document.querySelectorAll('[data-consensus]').forEach(form=>form.addEventListener('submit',ev=>{
   ev.preventDefault();try{const id=form.dataset.consensus,choice=form.elements.choice.value,reason=form.elements.reason.value.trim();if(!LABELS[choice]||!reason)throw new Error('请填写共识及具体讨论依据。');if(!state.reviewer.trim())throw new Error('请先在总览填写保存共识的姓名或固定代号。');const [a,b]=abVotes(id);const c={choice,reason,reviewer:state.reviewer,date:chinaDate(),saved_at:new Date().toISOString(),basis:voteBasis(a,b)};state.audit.push({type:'consensus',record_id:id,before:state.consensus[id]||null,after:c,at:c.saved_at});state.consensus[id]=c;const ok=persist();render();toast(ok?'共识已保存，双方原票保持独立。':'共识在内存中，请立即导出JSON。',!ok);}catch(error){toast(error.message,true);}
 }));
}
function draftFromForm(){const f=$('#vote-form');return {choice:f.elements.choice.value,reason:f.elements.reason.value,date:f.elements.date.value,minutes:f.elements.minutes.value};}
function saveDraft(){const f=$('#vote-form');state.reviewer=$('#screen-reviewer').value.trim();state.drafts[selected]=draftFromForm();const ok=persist();$('#draft-status').textContent=ok?'草稿已保存在本机；提交后计入进度。':'草稿仅在内存中，请立即导出JSON。';$('#draft-status').dataset.error=String(!ok);$('#vote-error').hidden=true;}
function submitVote(advance){
 try{const d=draftFromForm();state.reviewer=$('#screen-reviewer').value.trim();const v={...d,reason:d.reason.trim(),minutes:d.minutes===''?'':Number(d.minutes),reviewer:state.reviewer,role:state.role,saved_at:new Date().toISOString()};validateVote(v,state.role);state.audit.push({type:'vote',record_id:selected,before:state.votes[selected]||null,after:v,at:v.saved_at});state.votes[selected]=v;delete state.drafts[selected];if(advance&&countVotes(state)<30)selected=nextPending();state.last_id=selected;const ok=persist();if(advance&&countVotes(state)===30)go('exports');else render();toast(ok?(countVotes(state)===30?'30条全部提交。请下载CSV和JSON备份。':'判断已保存在本机。'):'判断仅在内存中，请立即导出JSON。',!ok);
 }catch(error){$('#vote-error').textContent=error.message;$('#vote-error').hidden=false;$('#vote-error').scrollIntoView({block:'center'});}
}
function download(content,type,filename){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);}
function exportJson(prefix='30条校准'){download(JSON.stringify(makePackage(state,digest),null,2),'application/json;charset=utf-8',`${prefix}_Reviewer_${state.role}_${chinaDate()}.json`);}
function navigateRecord(id){selected=id;state.last_id=id;persist();render();$('.reading-area')?.scrollIntoView({block:'start',behavior:'instant'});}
document.addEventListener('click',ev=>{
 const nav=ev.target.closest('[data-view]');if(nav){go(nav.dataset.view);return;}
 const record=ev.target.closest('[data-record]');if(record){navigateRecord(record.dataset.record);return;}
 const ft=ev.target.closest('[data-filter]');if(ft){filter=ft.dataset.filter;render();return;}
 const lang=ev.target.closest('[data-lang]');if(lang){const y=window.scrollY;language=lang.dataset.lang;render();window.scrollTo({top:y,behavior:'instant'});return;}
 const b=ev.target.closest('[data-action]');if(!b)return;
 try{switch(b.dataset.action){
  case 'resume': if(countVotes(state)===30)go('exports');else{selected=ids.find(id=>!state.votes[id])||selected;state.last_id=selected;persist();go('screening');}break;
  case 'prev':navigateRecord(ids[Math.max(0,ids.indexOf(selected)-1)]);break;
  case 'next':navigateRecord(ids[Math.min(29,ids.indexOf(selected)+1)]);break;
  case 'save-vote':submitVote(false);break;
  case 'export-csv':download(ownCsv(records,translations,state),'text/csv;charset=utf-8',`30条校准_Reviewer_${state.role}_${chinaDate()}.csv`);break;
  case 'export-json':exportJson();break;
  case 'restore':$('#restore-file').click();break;
  case 'partner':if(countVotes(state)<30)throw new Error('请先完成自己的30条。');$('#partner-file').click();break;
  case 'export-comparison':download(comparisonCsv(records,state),'text/csv;charset=utf-8','30条校准_双人比对与共识_'+chinaDate()+'.csv');break;
  case 'export-stats':download(agreementCsv(records,state),'text/csv;charset=utf-8','30条校准_一致性统计_'+chinaDate()+'.csv');break;
 }}catch(error){toast(error.message,true);}
});
async function readFile(input){const file=input.files[0];input.value='';if(!file)return null;if(file.size>2*1024*1024)throw new Error('文件超过2MB，请选择本站导出的JSON。');return JSON.parse(await file.text());}
$('#restore-file').addEventListener('change',async ev=>{try{const input=await readFile(ev.target);if(!input)return;const imported=validatePackage(input,ids,digest);pendingImport=imported;$('#import-summary').textContent=`文件：研究者 ${imported.role} · ${imported.reviewer||'未填写姓名'}；已提交 ${countVotes(imported)}/30条，草稿 ${Object.keys(imported.drafts).length} 条。将恢复此角色在本机的记录。`;(typeof $('#import-dialog').showModal==='function'?$('#import-dialog').showModal():$('#import-dialog').setAttribute('open',''));}catch(error){pendingImport=null;toast('未导入：'+error.message,true);}});
$('#cancel-import').addEventListener('click',()=>{pendingImport=null;$('#import-dialog').close();});
$('#confirm-import').addEventListener('click',()=>{
 if(!pendingImport)return;
 // Preserve the exact target role's previous state as well as the active role.
 exportJson('恢复前备份');
 if(pendingImport.role!==state.role){const target=loadState(pendingImport.role);download(JSON.stringify(makePackage(target,digest),null,2),'application/json;charset=utf-8',`恢复前备份_Reviewer_${target.role}_${chinaDate()}.json`);}
 state=pendingImport;pendingImport=null;activeRole=state.role;selected=state.last_id||ids.find(id=>!state.votes[id])||ids[0];const ok=persist();$('#import-dialog').close();go('overview');toast(ok?'个人备份已恢复到本机。':'备份已读入内存，浏览器无法持久保存。',!ok);
});
$('#partner-file').addEventListener('change',async ev=>{try{const input=await readFile(ev.target);if(!input)return;const snapshot=partnerSnapshot(input,state,ids,digest);if(state.partner)exportJson('更新搭档前备份');state.audit.push({type:'partner_snapshot',at:new Date().toISOString(),partner_exported_at:input.exported_at});state.partner=snapshot;const ok=persist();go('comparison');toast(ok?'搭档原票已导入，可以比对并记录共识。':'搭档原票已读入内存，请导出JSON。',!ok);}catch(error){toast('未导入：'+error.message,true);}});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(['overview','screening','exports','comparison','rules'].includes(next))go(next,false);});
window.addEventListener('storage',ev=>{if(ev.key===KEY+state.role){storageWarning('同一浏览器的另一页面更新了本角色记录。为避免覆盖，本页暂停写入；请导出本页备份后刷新，使用最新进度。');toast('检测到另一页面更新，请先备份再刷新。',true);}});
if(memoryOnly)storageWarning();
render();

</script>
</body>
</html>
